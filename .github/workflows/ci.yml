# SPDX-License-Identifier: GPL-3.0-or-later

# Continuous integration: format, license and layer checks, plus build and tests on
# macOS (arm64) and Ubuntu 24.04, each as debug+AddressSanitizer and as release.
# Every run also builds the installable packages (.dmg, AppImage, Flatpak) and starts them once
# (job "package", AP-0.7). Signing and notarisation with a paid Apple account are prepared and
# switched on by repository secrets; without them the .dmg is signed ad hoc (docs/paketierung.md).
#
# Libraries come from vcpkg (Qt included, FISSION_QT_SOURCE=vcpkg). One job per operating
# system builds them and fills the GitHub Actions cache; the build jobs then restore it.
# The first run on a fresh repository builds everything and takes hours; later runs only
# restore. A weekly run keeps the cache alive (GitHub deletes entries unused for 7 days).
# The key holds the version of the runner image (RUNNER_IMAGE, from ImageVersion): vcpkg's package hashes include
# the compiler, so a new image makes the old archives useless, and a key that stayed the same
# would be a hit that is never saved again (every job would then rebuild Qt, for hours).

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FISSION_QT_SOURCE: vcpkg
  VCPKG_DISABLE_METRICS: "1"

jobs:
  checks:
    name: Checks (format, license headers, layers, licenses)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format (clang-format 21)
        run: |
          python3 -m pip install --user clang-format==21.1.8
          user_base="$(python3 -m site --user-base)"
          CLANG_FORMAT="$user_base/bin/clang-format" python3 scripts/tools/check_format.py

      - name: License headers (SPDX)
        run: python3 scripts/tools/check_spdx.py .

      - name: Layer rules in the source
        run: python3 scripts/tools/check_layers.py .

      - name: Third-party licenses
        run: |
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg .vcpkg
          git -C .vcpkg checkout --quiet "$baseline"
          python3 scripts/tools/licenses.py check
          python3 scripts/tools/licenses.py notices --verify

  # Builds the third-party libraries (vcpkg) and stores them in the cache. The archives are
  # identical for debug and release (release-only libraries), so one entry per operating system.
  libraries:
    name: Libraries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            preset: macos-release
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            preset: linux-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's image version is no workflow variable; make it one for the cache keys.
      - name: Note the runner image
        run: echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-

      - name: Prerequisites (scripts/setup)
        run: scripts/setup --yes --no-dev-tools

      # Configuring runs "vcpkg install" for all libraries (a no-op on a warm cache).
      - name: Build libraries
        run: cmake --preset ${{ matrix.preset }}

      # Saved even when the build failed, so that a retry resumes instead of starting over.
      # Pull requests only read the cache.
      - name: Save vcpkg binary cache
        if: always() && github.event_name != 'pull_request' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}

      - name: Upload vcpkg log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-log-${{ matrix.preset }}
          retention-days: 14
          if-no-files-found: ignore
          path: build/${{ matrix.preset }}/vcpkg-manifest-install.log

  build:
    name: ${{ matrix.name }}
    needs: libraries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 · debug-asan
            os: macos-15
            preset: macos-asan
          - name: macOS arm64 · release
            os: macos-15
            preset: macos-release
          - name: Ubuntu 24.04 · debug-asan
            os: ubuntu-24.04
            preset: linux-asan
          - name: Ubuntu 24.04 · release
            os: ubuntu-24.04
            preset: linux-release

    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      # The runner's image version is no workflow variable; make it one for the cache keys.
      - name: Note the runner image
        run: echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.preset }}-

      - name: Prerequisites (scripts/setup)
        run: scripts/setup --yes --no-dev-tools

      - name: Install ccache
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else
            # xvfb and Mesa: the window tests run in a virtual screen with software OpenGL
            sudo apt-get install -y ccache xvfb libgl1-mesa-dri libglx-mesa0 libegl1
          fi

      - name: Configure and build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: clang-tidy on changed files (advisory)
        if: github.event_name == 'pull_request' && matrix.preset == 'linux-asan'
        run: |
          sudo apt-get install -y clang-tidy
          python3 scripts/tools/tidy_changed.py --build-dir build/${{ matrix.preset }} \
            --base origin/${{ github.base_ref }}

      - name: Save ccache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/smoke-test.png
            build/${{ matrix.preset }}/window-dark.png
            build/${{ matrix.preset }}/window-light.png
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log

  # Builds the installable packages from the cached libraries and starts each one once.
  # Packages must be built on the oldest supported system (Ubuntu 24.04: the AppImage and the
  # Flatpak need a glibc at least as old as every machine they should run on, ADR-0006).
  package:
    name: Package (${{ matrix.name }})
    needs: libraries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (.dmg)
            os: macos-15
          - name: Ubuntu 24.04 (AppImage, Flatpak)
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's image version is no workflow variable; make it one for the cache keys.
      - name: Note the runner image
        run: echo "RUNNER_IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-

      - name: Prerequisites (scripts/setup)
        run: scripts/setup --yes --no-dev-tools

      # ---- macOS ----------------------------------------------------------------------
      # Developer ID signing: only when the certificate secrets exist (paid Apple account).
      - name: Import signing certificate (only with secrets)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "No signing secrets: the app is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "ci" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "ci" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          echo "FISSION_CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build the .dmg (macOS)
        if: runner.os == 'macOS'
        run: scripts/package

      - name: Notarise (skipped without Apple credentials)
        if: runner.os == 'macOS'
        env:
          FISSION_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          FISSION_NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          FISSION_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: packaging/macos/notarize.sh build/package/Fission359-*-macos-arm64.dmg

      - name: Start the app from the .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls build/package/Fission359-*-macos-arm64.dmg)"
          mount_point="$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -readonly
          app="$mount_point/Fission359.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/fission359" --version
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/fission359" --smoke-test "$RUNNER_TEMP/dmg-smoke.png"
          test -s "$RUNNER_TEMP/dmg-smoke.png"
          hdiutil detach "$mount_point"

      # The window itself, with the graphics device of the runner (Metal). Advisory: runners
      # without a usable graphics device must not stop the package from being built.
      - name: Open the window from the .dmg (macOS, advisory)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          dmg="$(ls build/package/Fission359-*-macos-arm64.dmg)"
          mount_point="$RUNNER_TEMP/dmg2"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -readonly
          "$mount_point/Fission359.app/Contents/MacOS/fission359" --smoke-test "$RUNNER_TEMP/dmg-window.png" \
            --theme dark --language en --size 1280x800
          "$mount_point/Fission359.app/Contents/MacOS/fission359" --measure-startup
          cp "$RUNNER_TEMP/dmg-window.png" build/package/ || true
          hdiutil detach "$mount_point"

      # P22: the window tests (app_*) against the finished package, with the window system of the
      # runner (no offscreen: that gives false greens on macOS). The package carries the QML
      # plugins that the build tree lacks. The build tree of scripts/package is reused; only the
      # test helper is built in addition. The step does not stop the package: the job "Window
      # tests (macOS arm64, packaged app)" below turns its outcome into a check of its own.
      - name: Window tests against the packaged app (macOS)
        id: window_tests
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          app="$PWD/build/package/stage/Fission359.app/Contents/MacOS/fission359"
          test -x "$app"
          # The window tests have fixed pixel positions and ask for a window of 1280x800; a runner
          # screen smaller than that shrinks the window. Log the screen, and try to give it more room
          # (best effort; the program also keeps the asked-for size by itself in test mode).
          system_profiler SPDisplaysDataType | grep -i -E "resolution|displays|metal" || true
          if brew install displayplacer >/dev/null 2>&1; then
            displayplacer list || true
            screen_id="$(displayplacer list | awk '/Persistent screen id/ {print $4; exit}')"
            if [ -n "$screen_id" ]; then
              displayplacer "id:$screen_id res:1920x1080" || echo "Resolution not changed."
              displayplacer list | grep -i -E "resolution|current" || true
            fi
          fi
          cmake --preset macos-release -DFISSION_APP_UNDER_TEST="$app"
          cmake --build --preset macos-release --target fission_screenshot_check
          ctest --preset macos-release -R '^app_' --no-tests=error --timeout 600 \
            2>&1 | tee build/window-tests.log

      - name: Note the outcome of the window tests (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/window-tests-result
          echo "${{ steps.window_tests.outcome }}" > build/window-tests-result/outcome.txt
          cp build/window-tests.log build/window-tests-result/ 2>/dev/null || true
          cp build/macos-release/Testing/Temporary/LastTest.log build/window-tests-result/ 2>/dev/null || true
          cp build/macos-release/window-*.png build/window-tests-result/ 2>/dev/null || true

      - name: Upload the window test result (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-tests-macos
          retention-days: 14
          if-no-files-found: ignore
          path: build/window-tests-result

      # ---- Linux ----------------------------------------------------------------------
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf flatpak flatpak-builder desktop-file-utils appstream
          # Ubuntu 24.04 runners forbid the user namespaces that Flatpak's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build AppImage and Flatpak (Linux)
        if: runner.os == 'Linux'
        run: scripts/package --flatpak

      - name: Check metadata (Linux)
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate build/package/AppDir/usr/share/applications/*.desktop
          appstreamcli validate --no-net build/package/AppDir/usr/share/metainfo/*.metainfo.xml

      - name: Start the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          appimage="$(ls build/package/Fission359-*-x86_64.AppImage)"
          "$appimage" --version
          "$appimage" --smoke-test "$RUNNER_TEMP/appimage-smoke.png"
          test -s "$RUNNER_TEMP/appimage-smoke.png"

      # The window itself in a virtual screen with software OpenGL (no graphics device here).
      - name: Open the window from the AppImage (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1
          appimage="$(ls build/package/Fission359-*-x86_64.AppImage)"
          xvfb-run -a -s "-screen 0 1280x800x24" "$appimage" --smoke-test build/package/appimage-window.png \
            --theme dark --language en --size 1280x800
          xvfb-run -a -s "-screen 0 1280x800x24" "$appimage" --measure-startup

      - name: Start the Flatpak (Linux)
        if: runner.os == 'Linux'
        run: |
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.sloppyhenry.Fission359 --version

      # The one-command installer of the README, with the package of this run instead of a release.
      - name: Install and uninstall with scripts/install.sh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            package="$(ls build/package/Fission359-*-macos-arm64.dmg)"
          else
            package="$(ls build/package/Fission359-*-x86_64.AppImage)"
          fi
          FISSION_INSTALL_FROM="$package" bash scripts/install.sh
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(ls -d /Applications/Fission359.app "$HOME/Applications/Fission359.app" 2>/dev/null | head -n 1)"
            "$app/Contents/MacOS/fission359" --version
          else
            "$HOME/.local/bin/fission359" --version
            test -f "$HOME/.local/share/applications/io.github.sloppyhenry.Fission359.desktop"
            desktop-file-validate "$HOME/.local/share/applications/io.github.sloppyhenry.Fission359.desktop"
          fi
          bash scripts/install.sh --uninstall
          test ! -e /Applications/Fission359.app
          test ! -e "$HOME/Applications/Fission359.app"
          test ! -e "$HOME/.local/bin/fission359"
          test ! -e "$HOME/.local/share/fission359"
          test ! -e "$HOME/.local/share/applications/io.github.sloppyhenry.Fission359.desktop"

      # Diagnostics when packaging fails (what Qt looks like on this runner, what was bundled).
      - name: Collect packaging diagnostics
        if: failure()
        run: |
          mkdir -p build/package-diagnostics
          cp build/*/package-env.sh build/*/qmake-shim build/package/macdeployqt.log \
             build/package-diagnostics/ 2>/dev/null || true
          preset_dir="$(ls -d build/*-release | head -n 1)"
          prefix="$(ls -d "$preset_dir"/vcpkg_installed/*/ | head -n 1)"
          { echo "## Qt libraries"; ls "$prefix"lib | grep -i -E 'qt6(core|qml|quick)\b|libQt6(Core|Qml|Quick)\.' | head -20
            echo "## tools"; ls "$prefix"tools 2>/dev/null; ls "$prefix"tools/Qt6 2>/dev/null | head -40
            echo "## Frameworks in the bundle"; ls build/package/stage/*.app/Contents/Frameworks 2>/dev/null | head -60
            echo "## PlugIns in the bundle"; ls build/package/stage/*.app/Contents/PlugIns 2>/dev/null
            echo "## AppDir"; ls build/package/AppDir/usr 2>/dev/null; } > build/package-diagnostics/layout.txt 2>&1
          cat build/package-diagnostics/layout.txt
          cat build/*-release/qmake-shim 2>/dev/null | head -30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-diagnostics-${{ runner.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/package-diagnostics

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/package/*.dmg
            build/package/*.AppImage
            build/package/*.flatpak
            build/package/*-window.png

  # P22: shows the outcome of the macOS window tests of the job "package" as a check of its own.
  # Not (yet) a required check of the protected branch.
  window-tests-macos:
    name: Window tests (macOS arm64, packaged app)
    if: always() && needs.package.result != 'skipped'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: window-tests-macos
          path: window-tests

      - name: Report the outcome
        run: |
          outcome="$(cat window-tests/outcome.txt 2>/dev/null || echo missing)"
          echo "Outcome of the window tests on macOS: $outcome"
          tail -n 60 window-tests/window-tests.log 2>/dev/null || true
          test "$outcome" = success

  # A tag like v0.1.0-alpha.1 publishes the packages of this run as a GitHub pre-release
  # (ADR-0006: unsigned, so macOS needs the Gatekeeper detour described in docs/paketierung.md).
  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: release-files
          merge-multiple: true

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          rm -f release-files/*-window.png
          ls -l release-files
          gh release create "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" \
            --title "Fission359 ${TAG#v}" --prerelease --generate-notes
