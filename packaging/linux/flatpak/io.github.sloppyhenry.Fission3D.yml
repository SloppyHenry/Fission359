#
# Flatpak manifest, variant "package the finished build" (ADR-0006): the AppDir that
# packaging/linux/package.sh produces (Qt and all libraries bundled) is copied into the
# sandbox. That builds and runs locally, but it is NOT accepted by Flathub, which requires
# building every library from source without network access (planned before AP-6.1).
#
# Build:  scripts/package --flatpak     (copies this file to build/package/flatpak/)
app-id: io.github.sloppyhenry.Fission3D
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: fission3d

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Projects are saved and opened through the file chooser portal; Documents is the default place.
  - --filesystem=xdg-documents

modules:
  - name: fission3d
    buildsystem: simple
    build-commands:
      - cp -a usr/. /app/
    sources:
      - type: dir
        path: ../AppDir
