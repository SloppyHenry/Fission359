<title>Fission3D Oberfläche</title>
<style>
/* Layout: one-screen desktop app. Amber mockup strip on top (not part of the app), app grid below:
   tool groups / options / [recipe | 3D view | properties] / hint line. 3D view is the darkest, largest surface. */
:root{
  color-scheme: dark;
  --bg:#1b1d21; --panel:#222529; --panel-2:#2b2f35; --panel-3:#363a41; --field:#17191c;
  --line:#353940; --line-2:#474c55;
  --view:#111215; --view-2:#1b1d22;
  --fg:#e8eaed; --fg-2:#b9bec6; --fg-3:#9aa1ab;
  --accent:#4a9bff; --accent-text:#7ab6ff; --accent-fg:#06101f; --accent-soft:rgba(74,155,255,.18);
  --ok:#4cc683; --warn:#f2c24f; --bad:#ff6b6b;
  --ok-soft:rgba(76,198,131,.14); --warn-soft:rgba(242,194,79,.14); --bad-soft:rgba(255,107,107,.16);
  --note:#e6bf6e;
  --bed:#1d2025; --bed-rgb:29,32,37; --bed-edge:#3d434c; --grid:#272b31; --grid-2:#343a42;
  --ax-x:#e5534b; --ax-y:#5fb162; --ax-z:#4f94f0;
  --edge:rgba(8,10,14,.55); --shd:rgba(0,0,0,.65);
  --handle:#ffffff; --handle-line:#16181b;
  --glass:rgba(32,35,40,.9); --shadow-ui:rgba(0,0,0,.45);
  --ghost:rgba(170,182,200,.26); --ghost-line:rgba(215,222,234,.8);
  --demo-bg:#2c2516; --demo-bg2:#3a311c; --demo-fg:#f4e5c2; --demo-line:#7c6534; --demo-on:#fff8e8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Cantarell,"Noto Sans",Ubuntu,sans-serif;
  --font-round:"Arial Rounded MT Bold","Nunito","Varela Round",-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono","DejaVu Sans Mono",monospace;
  --dur:180ms;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme: light;
  --bg:#eceef1; --panel:#f7f8fa; --panel-2:#e9ecf0; --panel-3:#dde1e7; --field:#ffffff;
  --line:#d3d8df; --line-2:#c2c8d1; --view:#d6dae0; --view-2:#e9ecf0;
  --fg:#1c1f24; --fg-2:#454b55; --fg-3:#5a616c;
  --accent:#1f6fe5; --accent-text:#1a5fc8; --accent-fg:#ffffff; --accent-soft:rgba(31,111,229,.12);
  --ok:#1b7f48; --warn:#8f5c00; --bad:#c62828;
  --ok-soft:rgba(27,127,72,.1); --warn-soft:rgba(143,92,0,.1); --bad-soft:rgba(198,40,40,.1);
  --note:#80520a;
  --bed:#c9ced6; --bed-rgb:201,206,214; --bed-edge:#a3aab5; --grid:#b9c0c9; --grid-2:#a6aeb9;
  --edge:rgba(20,24,30,.45); --shd:rgba(30,40,60,.35); --handle:#ffffff; --handle-line:#1c1f24;
  --glass:rgba(250,251,252,.92); --shadow-ui:rgba(30,40,60,.18);
  --ghost:rgba(90,110,140,.22); --ghost-line:rgba(40,60,90,.75);
  --demo-bg:#fbf0d4; --demo-bg2:#fff8e6; --demo-fg:#4a3810; --demo-line:#c9a253; --demo-on:#2a1d03;
}}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eceef1; --panel:#f7f8fa; --panel-2:#e9ecf0; --panel-3:#dde1e7; --field:#ffffff;
  --line:#d3d8df; --line-2:#c2c8d1; --view:#d6dae0; --view-2:#e9ecf0;
  --fg:#1c1f24; --fg-2:#454b55; --fg-3:#5a616c;
  --accent:#1f6fe5; --accent-text:#1a5fc8; --accent-fg:#ffffff; --accent-soft:rgba(31,111,229,.12);
  --ok:#1b7f48; --warn:#8f5c00; --bad:#c62828;
  --ok-soft:rgba(27,127,72,.1); --warn-soft:rgba(143,92,0,.1); --bad-soft:rgba(198,40,40,.1);
  --note:#80520a;
  --bed:#c9ced6; --bed-rgb:201,206,214; --bed-edge:#a3aab5; --grid:#b9c0c9; --grid-2:#a6aeb9;
  --edge:rgba(20,24,30,.45); --shd:rgba(30,40,60,.35); --handle:#ffffff; --handle-line:#1c1f24;
  --glass:rgba(250,251,252,.92); --shadow-ui:rgba(30,40,60,.18);
  --ghost:rgba(90,110,140,.22); --ghost-line:rgba(40,60,90,.75);
  --demo-bg:#fbf0d4; --demo-bg2:#fff8e6; --demo-fg:#4a3810; --demo-line:#c9a253; --demo-on:#2a1d03;
}
:root[data-accent="orange"]{ --accent:#ff8d3a; --accent-text:#ffa35f; --accent-fg:#1d0f03; --accent-soft:rgba(255,141,58,.18); }
:root[data-accent="orange"][data-theme="light"]{ --accent:#c4560c; --accent-text:#ad4a07; --accent-fg:#ffffff; --accent-soft:rgba(196,86,12,.12); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:600 12px/1 var(--mono);padding:3px 6px;border-radius:4px;background:var(--panel-3);border:1px solid var(--line-2);border-bottom-width:2px;color:var(--fg);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--note);border:1px dashed var(--note);border-radius:4px;padding:0 5px;line-height:18px;white-space:nowrap;cursor:help}

/* ---------- mockup strip (not part of the app) ---------- */
#demo{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 12px;background:var(--demo-bg);color:var(--demo-fg);border-bottom:1px dashed var(--demo-line);font-size:12px;position:relative;z-index:40}
#demo .tag{font-weight:750;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--demo-line);border-radius:4px}
#demo .grp-d{display:flex;align-items:center;gap:6px}
#demo .lbl{opacity:.85}
.seg{display:inline-flex;border:1px solid var(--demo-line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 9px;color:inherit;font-size:12px}
.seg button+button{border-left:1px solid var(--demo-line)}
.seg button[aria-pressed="true"]{background:var(--demo-line);color:var(--demo-on);font-weight:650}
#demo select{background:var(--demo-bg2);color:var(--demo-fg);border:1px solid var(--demo-line);border-radius:6px;padding:3px 6px;max-width:230px;font-size:12px}
.dbtn{background:var(--demo-bg2);border:1px solid var(--demo-line);border-radius:6px;padding:3px 9px;color:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px}

/* ---------- app grid ---------- */
#app{flex:1;min-height:0;position:relative;display:grid;--lw:216px;--rw:244px;
  grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);
  grid-template-rows:46px 34px minmax(0,1fr) 32px;
  grid-template-areas:"top top top" "opts opts opts" "left view right" "hint hint hint"}
#app.lc{--lw:40px} #app.rc{--rw:40px}
#app.kit{grid-template-rows:46px auto minmax(0,1fr) 44px;--rw:0px;--lw:300px}
#app.kit #right{display:none}
#app.kit #opts{padding:0;white-space:normal;align-items:stretch}
#top{grid-area:top} #opts{grid-area:opts} #left{grid-area:left} #view{grid-area:view} #right{grid-area:right} #hint{grid-area:hint}

#top{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.brand svg{width:22px;height:22px}
.doc{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:6px}
.doc .saved{color:var(--fg-3);font-size:12px}
.groups{display:flex;gap:2px;margin-left:6px}
.grp{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:7px;border:0;background:none;color:var(--fg-2);white-space:nowrap;transition:background var(--dur),color var(--dur)}
.grp:hover{background:var(--panel-2);color:var(--fg)}
.grp.on,.grp[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-text)}
.spacer{flex:1}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;border:0;background:none;color:var(--fg-2)}
.iconbtn:hover{background:var(--panel-2);color:var(--fg)}
.searchbtn{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg-3);min-width:200px}
.searchbtn span{flex:1;text-align:left}
.searchbtn:hover{border-color:var(--line-2);color:var(--fg-2)}

#opts{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--fg-2);overflow:hidden;white-space:nowrap;min-width:0}
#opts .o-sep{width:1px;height:18px;background:var(--line)}
#opts .o-k{color:var(--fg-3)}
.ochk{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:2px 4px;border-radius:5px;color:var(--fg-2);font-size:12px}
.ochk:hover{background:var(--panel-2)}
.ochk .bx{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--field)}
.ochk[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ochk .bx .ic{width:11px;height:11px;stroke-width:3}
.osel{display:inline-flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}

/* ---------- side panels ---------- */
aside.panel{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#left{border-right:1px solid var(--line)} #right{border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:32px;padding:0 4px 0 12px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line);flex:none}
.ph .iconbtn{width:24px;height:24px}
.pbody{overflow:auto;padding:8px;flex:1;min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}

.rc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ri{display:grid;grid-template-columns:16px 16px minmax(0,1fr) 16px;gap:6px;align-items:start;width:100%;text-align:left;padding:6px;border-radius:7px;border:1px solid transparent;background:none;color:var(--fg);transition:background var(--dur)}
.ri:hover{background:var(--panel-2)}
.ri .num{color:var(--fg-3);font-variant-numeric:tabular-nums;font-size:12px;line-height:18px}
.ri .ic{margin-top:1px;color:var(--fg-2)}
.ri .rt{line-height:18px}
.ri .rt small{display:block;color:var(--fg-3);font-size:12px}
.ri .rt small.stw.bad{color:var(--bad);font-weight:600} .ri .rt small.stw.edit{color:var(--accent-text)}
.ri.edit{background:var(--accent-soft);border-color:var(--accent)}
.ri.bad{background:var(--bad-soft);border-color:var(--bad)}
.ri.warn{background:var(--warn-soft);border-color:var(--warn)}
.st{font-size:12px;line-height:18px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.st .ic{width:13px;height:13px;margin:0;stroke-width:2.4}
.st.ok{color:var(--ok)} .st.edit{color:var(--accent-text)} .st.bad{color:var(--bad);font-weight:650} .st.warn{color:var(--warn);font-weight:650}
.now{display:flex;align-items:center;gap:8px;color:var(--accent-text);font-size:12px;font-weight:650;margin:6px 0;cursor:ns-resize;user-select:none}
.now::before,.now::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--accent)}
.empty{color:var(--fg-3);font-size:12px;padding:6px 8px;line-height:1.5}
.ptitle{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);margin:14px 6px 6px;display:flex;justify-content:space-between;align-items:center}
.bd{display:grid;grid-template-columns:26px 14px minmax(0,1fr);align-items:center;gap:8px;padding:2px 6px;border-radius:6px}
.bd:hover{background:var(--panel-2)}
.bd .iconbtn{width:26px;height:26px}
.bd.off .nm{color:var(--fg-3);text-decoration:line-through}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid var(--edge)}
.sw.holes{background:repeating-linear-gradient(45deg,var(--fg-3) 0 2px,transparent 2px 4px)}

.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.sec h3 .badge{margin-left:auto}
.badge{font-size:12px;font-weight:600;border-radius:10px;padding:0 8px;line-height:20px;display:inline-flex;align-items:center;gap:4px}
.badge.ok{color:var(--ok);background:var(--ok-soft)} .badge.bad{color:var(--bad);background:var(--bad-soft)} .badge.edit{color:var(--accent-text);background:var(--accent-soft)}
.badge .ic{width:13px;height:13px;stroke-width:2.4}
.fld{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:3px 8px;margin:7px 0}
.fl-l{color:var(--fg-2);cursor:ew-resize;user-select:none}
.fl-in{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:6px;height:28px;padding:0 8px;transition:border-color var(--dur),box-shadow var(--dur)}
.fl-in:focus-within,.fld.active .fl-in{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fl-in input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;font-variant-numeric:tabular-nums;padding:0}
.unit{color:var(--fg-3);margin-left:5px;font-size:12px}
.fl-bar{grid-column:2;height:3px;background:var(--panel-3);border-radius:2px}
.fl-bar i{display:block;height:100%;background:var(--accent);border-radius:2px;opacity:.75}
.fld.err .fl-in{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.fl-note{grid-column:2;font-size:12px;color:var(--fg-3)}
.fld.err .fl-note{color:var(--bad)}
.segc{display:flex;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.segc button{flex:1;border:0;background:none;border-radius:5px;padding:3px 6px;font-size:12px;color:var(--fg-2)}
.segc button[aria-pressed="true"]{background:var(--panel-3);color:var(--fg);font-weight:600}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px;margin:7px 0}
.row>span:first-child{color:var(--fg-2)}
.selbox{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:6px;height:28px;padding:0 8px;width:100%;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--edge);flex:none}
.sw-row{display:flex;gap:6px;flex-wrap:wrap}
.sw-row button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw-row button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.switch{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--fg)}
.switch .tr{width:32px;height:18px;border-radius:9px;background:var(--panel-3);position:relative;transition:background var(--dur)}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform var(--dur)}
.switch[aria-checked="true"] .tr{background:var(--accent)}
.switch[aria-checked="true"] .tr::after{transform:translateX(14px);background:var(--accent-fg)}
details.more{margin-top:6px}
details.more summary{cursor:pointer;color:var(--fg-2);list-style:none;padding:4px 0;font-size:12px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "} details.more[open] summary::before{content:"▾ "}
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:650}
.btn.ghost{background:none}
.btn.full{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-text);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.chk .ic{color:var(--ok);stroke-width:2.4;margin-top:1px}
.chk small{display:block;color:var(--fg-3);font-size:12px}
.tipcard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tipcard p{margin:0}

/* ---------- 3D view ---------- */
#view{position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 42%,var(--view-2),var(--view));min-width:0;min-height:0}
#view svg.scene{position:absolute;inset:0;display:block}
#ov{position:absolute;inset:0;pointer-events:none}
#ov .ov{position:absolute;pointer-events:auto}
.bed-top{fill:var(--bed)} .grid{stroke:var(--grid);stroke-width:1} .grid.major{stroke:var(--grid-2)}
.bed-rim{fill:none;stroke:var(--bed-edge);stroke-width:1.5}
.ax-x{stroke:var(--ax-x);stroke-width:1.6;opacity:.85} .ax-y{stroke:var(--ax-y);stroke-width:1.6;opacity:.85}
.origin{fill:var(--fg-2)}
.bedlabel{fill:var(--fg-3);font-size:12px;font-family:var(--font)}
.shd{fill:var(--shd)}
.hdl{fill:var(--handle);stroke:var(--handle-line);stroke-width:1.3;cursor:pointer;transition:fill var(--dur)}
.hdl:hover{fill:var(--accent)}
.hdl.lift{fill:var(--handle-line);stroke:var(--handle)}
.cursor{fill:#ffffff;stroke:#000000;stroke-width:1.1;stroke-linejoin:round}
.dim{stroke:var(--fg-2);stroke-width:1.2;fill:none} .dim-ext{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:3 3;fill:none}
.accl{stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round}
.accf{fill:var(--accent)}
.accsoft{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.ghost{fill:url(#stripes);stroke:var(--ghost-line);stroke-width:1.3;stroke-dasharray:5 4}
.ghost-top{fill:none;stroke:var(--ghost-line);stroke-width:1.3;stroke-dasharray:5 4}
.gs-a{fill:var(--ghost)} .gs-b{stroke:var(--ghost-line);stroke-width:2.2;opacity:.7}
.ghost-red{fill:var(--bad-soft);stroke:var(--bad);stroke-dasharray:5 4;stroke-width:1.6}
.badl{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.pick{cursor:pointer}
.pick:hover{stroke:var(--accent)!important;stroke-width:2!important}
.emb{font-family:var(--font-round);font-weight:800}
.ptr{stroke:var(--fg-3);stroke-width:1.2;fill:none;stroke-dasharray:2 3}

.bubble{transform:translate(16px,14px);background:var(--glass);border:1px solid var(--line-2);border-radius:8px;padding:4px 9px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px var(--shadow-ui);color:var(--fg-2);backdrop-filter:blur(6px)}
.bubble b{font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.bubble .typed{color:var(--accent-text)}
.chip{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--line-2);border-radius:14px;padding:3px 10px;font-size:12px;white-space:nowrap;color:var(--fg);box-shadow:0 4px 12px var(--shadow-ui)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.chip.ok .ic{color:var(--ok);stroke-width:2.4}
.chip.acc{border-color:var(--accent);color:var(--accent-text)}

/* Expression parser for number fields: 25+3, 40/2, 2,5 cm, 1 in, Breite/2. Comma and dot both work. */
const NAMED = {breite:50,tiefe:20,'höhe':4,hoehe:4,width:50,depth:20,height:4};
function parseExpr(src){
  const s=src.replace(/\s+/g,''); let i=0;
  const num=()=>{const m=/^\d+(?:[.,]\d+)?|^[.,]\d+/.exec(s.slice(i)); if(!m) return null; i+=m[0].length; return parseFloat(m[0].replace(',','.'));};
  const unit=v=>{const m=/^(mm|cm|in|zoll|")/i.exec(s.slice(i)); if(!m) return v; i+=m[0].length; const u=m[0].toLowerCase(); return v*(u==='cm'?10:u==='mm'?1:25.4);};
  const atom=()=>{
    if(s[i]==='('){i++; const v=expr(); if(s[i]!==')') throw 0; i++; return unit(v);}
    if(s[i]==='-'){i++; return -atom();}
    const v=num(); if(v!==null) return unit(v);
    const m=/^[a-zäöüß_]+/i.exec(s.slice(i));
    if(m && (m[0].toLowerCase() in NAMED)){ i+=m[0].length; return unit(NAMED[m[0].toLowerCase()]); }
    throw 0;
  };
  const term=()=>{let v=atom(); while(s[i]==='*'||s[i]==='/'){const o=s[i++]; const r=atom(); v=o==='*'?v*r:v/r;} return v;};
  const expr=()=>{let v=term(); while(s[i]==='+'||s[i]==='-'){const o=s[i++]; const r=term(); v=o==='+'?v+r:v-r;} return v;};
  try{ const v=expr(); return i===s.length && isFinite(v) ? v : NaN; }catch(e){ return NaN; }
}

/* ======================= tiny 3D mock renderer ======================= */
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=v=>{const l=Math.hypot(...v)||1; return v.map(x=>x/l);};
const LIGHT=norm([0.35,-0.55,0.76]);
function cam(o){
  const a=o.a*D2R, e=o.e*D2R, ca=Math.cos(a), sa=Math.sin(a), ce=Math.cos(e), se=Math.sin(e);
  const tx=o.tx||0, ty=o.ty||0, tz=o.tz||0;
  return {
    o, s:o.s,
    p:(x,y,z)=>{x-=tx;y-=ty;z-=tz; const u=x*ca-y*sa, w=x*sa+y*ca, up=z*ce+w*se; return [o.cx+u*o.s, o.cy-up*o.s];},
    depth:(x,y,z)=>-(x*sa+y*ca)*ce+z*se,
    toCam:[-sa*ce,-ca*ce,se]
  };
}
function rrect(w,d,r,ox=0,oy=0,n=14){
  r=Math.max(0,Math.min(r,w/2-0.01,d/2-0.01));
  const cs=[[w/2-r,-d/2+r,-90],[w/2-r,d/2-r,0],[-w/2+r,d/2-r,90],[-w/2+r,-d/2+r,180]], pts=[];
  for(const [cx,cy,a0] of cs){
    if(r<=0){pts.push([ox+cx,oy+cy]);continue;}
    for(let i=0;i<=n;i++){const a=(a0+90*i/n)*D2R; pts.push([ox+cx+r*Math.cos(a),oy+cy+r*Math.sin(a)]);}
  }
  return pts;
}
const circle=(cx,cy,r,n=48)=>Array.from({length:n},(_,i)=>[cx+r*Math.cos(i/n*2*Math.PI),cy+r*Math.sin(i/n*2*Math.PI)]);
function starPts(cx,cy,R,r,k=5,rot=90){const p=[];for(let i=0;i<2*k;i++){const a=(rot+i*180/k)*D2R, q=i%2?r:R; p.push([cx+q*Math.cos(a),cy+q*Math.sin(a)]);}return p;}
function gearPts(R,r,t=10){const p=[];for(let i=0;i<t;i++){const a=i/t*2*Math.PI, s=2*Math.PI/t;
  [[0,r],[.12,R],[.38,R],[.5,r]].forEach(([f,q])=>p.push([q*Math.cos(a+f*s),q*Math.sin(a+f*s)]));
  p.push([r*Math.cos(a+.75*s),r*Math.sin(a+.75*s)]);}return p;}
function prismFaces(pts,z0,z1,map=(x,y,z)=>[x,y,z],rgb){
  const F=[], n=pts.length;
  for(let i=0;i<n;i++){const a=pts[i], b=pts[(i+1)%n]; F.push({pts:[map(a[0],a[1],z0),map(b[0],b[1],z0),map(b[0],b[1],z1),map(a[0],a[1],z1)],rgb});}
  F.push({pts:pts.map(p=>map(p[0],p[1],z1)),top:true,rgb});
  F.push({pts:pts.slice().reverse().map(p=>map(p[0],p[1],z0)),rgb});
  return F;
}
function sphereFaces(cx,cy,cz,r,rgb,nu=36,nv=18){
  const F=[], P=(u,v)=>[cx+r*Math.cos(v)*Math.cos(u),cy+r*Math.cos(v)*Math.sin(u),cz+r*Math.sin(v)];
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const u0=i/nu*2*Math.PI,u1=(i+1)/nu*2*Math.PI,v0=-Math.PI/2+j/nv*Math.PI,v1=-Math.PI/2+(j+1)/nv*Math.PI;
    F.push({pts:[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],rgb});}
  return F;
}
function coneFaces(cx,cy,r,h,rgb,n=36){
  const b=circle(cx,cy,r,n), F=[];
  for(let i=0;i<n;i++){const a=b[i],c=b[(i+1)%n]; F.push({pts:[[a[0],a[1],0],[c[0],c[1],0],[cx,cy,h]],rgb});}
  return F;
}
function torusFaces(R,r,z,rgb,nu=30,nv=12){
  const F=[], P=(u,v)=>[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),z+r*Math.sin(v)];
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const u0=i/nu*2*Math.PI,u1=(i+1)/nu*2*Math.PI,v0=j/nv*2*Math.PI,v1=(j+1)/nv*2*Math.PI;
    F.push({pts:[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],rgb});}
  return F;
}
function latheFaces(prof,rgb,wall=1.2,n=32){
  const F=[], P=(r,z,u)=>[r*Math.cos(u),r*Math.sin(u),z];
  for(let i=0;i<n;i++){const u0=i/n*2*Math.PI,u1=(i+1)/n*2*Math.PI;
    for(let k=0;k<prof.length-1;k++){const [ra,za]=prof[k],[rb,zb]=prof[k+1];
      F.push({pts:[P(ra,za,u0),P(ra,za,u1),P(rb,zb,u1),P(rb,zb,u0)],rgb});
      if(k>0) F.push({pts:[P(ra-wall,za,u1),P(ra-wall,za,u0),P(rb-wall,zb,u0),P(rb-wall,zb,u1)],rgb});}
    const [rt,zt]=prof[prof.length-1];
    F.push({pts:[P(rt,zt,u0),P(rt,zt,u1),P(rt-wall,zt,u1),P(rt-wall,zt,u0)],rgb});}
  return F;
}
function newell(P){let x=0,y=0,z=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
  x+=(a[1]-b[1])*(a[2]+b[2]); y+=(a[2]-b[2])*(a[0]+b[0]); z+=(a[0]-b[0])*(a[1]+b[1]);} return norm([x,y,z]);}
function shade(rgb,n,C,mul=1){const d=Math.max(0,dot(n,LIGHT)), v=Math.max(0,dot(n,C.toCam)), k=(0.5+0.5*d+0.12*v)*mul;
  return `rgb(${rgb.map(c=>Math.min(255,Math.round(c*k))).join(',')})`;}
const ptsAttr=(C,P)=>P.map(p=>{const q=C.p(p[0],p[1],p[2]); return r1(q[0])+','+r1(q[1]);}).join(' ');
const ptsAttr2=Q=>Q.map(q=>r1(q[0])+','+r1(q[1])).join(' ');
/* Painter's algorithm with back-face culling: good enough for a mock of matte printed plastic. */
function drawPoly(C,faces,rgb,opt={}){
  const vis=[];
  for(const f of faces){const n=newell(f.pts); if(dot(n,C.toCam)<=1e-4) continue;
    let d=0; for(const p of f.pts) d+=C.depth(p[0],p[1],p[2]); vis.push({f,n,d:d/f.pts.length});}
  vis.sort((a,b)=>a.d-b.d);
  return vis.map(({f,n})=>{const fill=shade(f.rgb||rgb,n,C); const edge=opt.edges||f.top;
    return `<polygon points="${ptsAttr(C,f.pts)}" fill="${fill}" stroke="${edge?'var(--edge)':fill}" style="${edge?'stroke:var(--edge)':''}" stroke-width="${edge?1:0.7}" stroke-linejoin="round" ${opt.pick?`class="pick" data-act="${opt.pick}"`:''}/>`;}).join('');
}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of P.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1));}
function drawHole(C,cx,cy,r,zt,zb,rgb){
  const id=uid('hc'), top=circle(cx,cy,r,48).map(p=>[p[0],p[1],zt]), bot=circle(cx,cy,r,48).map(p=>[p[0],p[1],zb]);
  const wall=`rgb(${rgb.map(c=>Math.round(c*.5)).join(',')})`;
  return `<clipPath id="${id}"><polygon points="${ptsAttr(C,top)}"/></clipPath>
    <polygon points="${ptsAttr(C,top)}" fill="${wall}" style="stroke:var(--edge)" stroke-width="1"/>
    <polygon points="${ptsAttr(C,bot)}" class="bed-top" clip-path="url(#${id})"/>`;
}
function affine(C,x,y,z){const p0=C.p(x,y,z),pu=C.p(x+1,y,z),pv=C.p(x,y-1,z);
  return [pu[0]-p0[0],pu[1]-p0[1],pv[0]-p0[0],pv[1]-p0[1],p0[0],p0[1]].map(v=>Math.round(v*1000)/1000).join(' ');}
function embossText(C,lines,x,y,z,h,size,rgb,lh=1.15){
  const n=Math.max(3,Math.round(h/0.2)), side=`rgb(${rgb.map(c=>Math.round(c*.62)).join(',')})`, top=`rgb(${rgb.join(',')})`;
  const L=[].concat(lines), y0=-(L.length-1)*size*lh/2; let out='';
  for(let i=0;i<=n;i++){const last=i===n;
    out+=`<text class="emb" transform="matrix(${affine(C,x,y,z+h*i/n)})" font-size="${size}" text-anchor="middle" dominant-baseline="central" fill="${last?top:side}" ${last?'style="stroke:var(--edge)" stroke-width="0.07"':''}>${L.map((t,k)=>`<tspan x="0" y="${r1(y0+k*size*lh)}">${t}</tspan>`).join('')}</text>`;}
  return out;
}
function cylGhost(C,cx,cy,r,z0,z1){
  const c=circle(cx,cy,r,48), all=[...c.map(p=>C.p(p[0],p[1],z0)),...c.map(p=>C.p(p[0],p[1],z1))];
  return `<polygon points="${ptsAttr2(hull(all))}" class="ghost"/><polygon points="${ptsAttr(C,c.map(p=>[p[0],p[1],z1]))}" class="ghost-top"/>`;
}
function shadowOf(C,outline,h,sd){
  const off=outline.map(p=>C.p(p[0]-0.28*h-0.6,p[1]+0.42*h+0.8,0)), base=outline.map(p=>C.p(p[0],p[1],0));
  return `<polygon points="${ptsAttr2(off)}" class="shd" opacity=".55" filter="url(#blurL)"/><polygon points="${ptsAttr2(base)}" class="shd" opacity=".7" filter="url(#blurS)"/>`;
}
const SVGDEFS = sd => `<defs>
  <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${r1(sd)}"/></filter>
  <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${r1(Math.max(1,sd/3))}"/></filter>
  <pattern id="stripes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="gs-a"/><line x1="0" y1="0" x2="0" y2="7" class="gs-b"/></pattern>
</defs>`;
const COL={white:[236,232,224],red:[214,66,56],green:[66,156,96],yellow:[242,183,56],blue:[70,136,206],grey:[150,156,166],
  purple:[146,112,200],orange:[236,128,52],teal:[52,166,160],dark:[40,42,48],steel:[120,138,170]};

function shapeSvg(kind,w=60,h=50,zoom=1){
  const C=cam({a:-30,e:30,s:1.15*zoom*(w/60),cx:w/2,cy:h*0.62,tx:0,ty:0,tz:0});
  let g='';
  switch(kind){
    case 'quader': g=drawPoly(C,prismFaces(rrect(20,20,0),0,18),COL.blue,{edges:true}); break;
    case 'zylinder': g=drawPoly(C,prismFaces(circle(0,0,10,40),0,18),COL.orange); break;
    case 'kugel': g=drawPoly(C,sphereFaces(0,0,10,10.5,COL.purple),COL.purple); break;
    case 'kegel': g=drawPoly(C,coneFaces(0,0,10.5,20,COL.yellow),COL.yellow); break;
    case 'torus': g=drawPoly(C,torusFaces(8.5,3.6,4,COL.green),COL.green); break;
    case 'roehre': g=drawPoly(C,prismFaces(circle(0,0,10,40),0,16),COL.teal)+drawHole(C,0,0,6,16,0,COL.teal); break;
    case 'prisma': g=drawPoly(C,prismFaces(circle(0,0,10.5,6),0,16),COL.teal,{edges:true}); break;
    case 'pyramide': { const b=[[-10,-10],[10,-10],[10,10],[-10,10]], F=[];
      for(let i=0;i<4;i++){const a=b[i],c=b[(i+1)%4]; F.push({pts:[[a[0],a[1],0],[c[0],c[1],0],[0,0,18]]});}
      g=drawPoly(C,F,COL.yellow,{edges:true}); break; }
    case 'text': g=embossText(C,'Aa',0,0,0,5,17,COL.red); break;
    case 'stern': g=drawPoly(C,prismFaces(starPts(0,0,13,5.5),0,5),COL.yellow); break;
    case 'karte': g=drawPoly(C,prismFaces(rrect(34,24,2),0,1.4),COL.white)
      +drawPoly(C,prismFaces([[-6,-9],[6,-9],[2,-3],[5,-3],[1,3],[3,3],[-0,9],[-3,3],[-1,3],[-5,-3],[-2,-3]].map(p=>[p[0]-6,p[1]]),1.4,3),COL.green)
      +drawPoly(C,prismFaces(starPts(-6,10,2.6,1.1),1.4,3.4),COL.yellow); break;
    case 'vase': g=drawPoly(C,latheFaces([[0.01,0],[7,0],[9.5,6],[8,14],[5,19],[6.5,23]],COL.purple,1.1,48),COL.purple); break;
    case 'figur': g=drawPoly(C,[...sphereFaces(0,0,6.5,6.5,COL.white),...sphereFaces(0,0,16,4.6,COL.white),...sphereFaces(0,-4.2,16.5,1,COL.orange,10,6),
      ...sphereFaces(1.6,-3.8,18,.6,COL.dark,8,5),...sphereFaces(-1.6,-3.8,18,.6,COL.dark,8,5)],COL.white); break;
    case 'schmuck': g=drawPoly(C,[...prismFaces(starPts(0,0,13,5.5,6),0,4,undefined,COL.red),...torusFaces(2.4,.8,0,COL.red,14,6).map(f=>({...f,pts:f.pts.map(p=>[p[0],p[1]+15,p[2]+2])}))],COL.red); break;
    case 'schild': g=drawPoly(C,prismFaces(rrect(34,16,3),0,2),COL.blue)+embossText(C,'TOM',0,0,2,1.4,8.5,COL.white); break;
    case 'halterung': g=drawPoly(C,prismFaces([[0,0],[18,0],[18,3.5],[3.5,3.5],[3.5,18],[0,18]],0,14,(u,v,t)=>[u-9,-(t-7),v]),COL.orange,{edges:true}); break;
    case 'box': g=drawPoly(C,prismFaces(rrect(22,18,1.5),0,11),COL.teal)+drawPoly(C,prismFaces(rrect(23,19,1.8),11.6,14.6),[120,200,190]); break;
    case 'ersatzteil': g=drawPoly(C,prismFaces(gearPts(12,9.4,10),0,5),COL.grey)+drawHole(C,0,0,3.4,5,0,COL.grey); break;
    case 'anhaenger': g=drawPoly(C,prismFaces(rrect(30,12,3),0,2.4),COL.white)+drawHole(C,-11.5,0,1.8,2.4,0,COL.white)+embossText(C,'LENA',2,0,2.4,1,6,COL.red); break;
    case 'leer': { const sq=[[-14,-14],[14,-14],[14,14],[-14,14]].map(p=>C.p(p[0],p[1],0)); const c=C.p(0,0,0);
      g=`<polygon points="${ptsAttr2(sq)}" style="fill:var(--bed);stroke:var(--fg-3)" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M${r1(c[0]-7)} ${r1(c[1])}h14M${r1(c[0])} ${r1(c[1]-7)}v14" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round"/>`; break; }
  }
  return `<svg class="shape" viewBox="0 0 ${w} ${h}" aria-hidden="true">${g}</svg>`;
}

/* ======================= left: recipe + bodies ======================= */
const CIRC='①②③④⑤⑥⑦⑧⑨';
function recipe(){
  const id=S.scene, q=(st,v)=>({ic:'cube',t:T('Quader','Box')+' '+(v||T('50 × 20 × 4 mm','50 × 20 × 4 mm')),st,go:'tippen'});
  const r=st=>({ic:'round',t:T('4 senkrechte Kanten abgerundet · 4 mm','4 vertical edges rounded · 4 mm'),st,go:'abrunden'});
  const tx=st=>({ic:'text',t:T('Text „LENA“ geprägt · 1,5 mm','Text “LENA” embossed · 1.5 mm'),st,go:'text'});
  const lo=st=>({ic:'hole',t:T('Loch Ø 5 mm durchgehend','Hole Ø 5 mm through'),sub:T('schneidet aus: Quader','subtracts from: Box'),st,go:'loch'});
  switch(id){
    case 'leer': return [];
    case 'quader': return [q('edit','34 × 20 × 20 mm')];
    case 'tippen': { const t=S.typed; const v=t?`${fmt(t.w)} × ${fmt(t.d)} × ${fmt(t.h)} mm`:undefined; return [q(t&&!t.done?'edit':'ok',v)]; }
    case 'abrunden': return [q('ok'),r('edit')];
    case 'text': return [q('ok'),r('ok'),tx('edit')];
    case 'loch': return [q('ok'),r('ok'),tx('ok'),lo('edit')];
    case 'fehler': return [q('ok'),r('ok'),tx('ok'),lo('ok'),{ic:'round',t:T('4 Kanten oben abgerundet · ','4 top edges rounded · ')+(S.errorFixed?T('3,9 mm','3.9 mm'):'5 mm'),sub:S.errorFixed?'':T('Die Rundung passt nicht hinein','The rounding does not fit'),st:S.errorFixed?'ok':'bad',go:'fehler'}];
    case 'rund': return [{ic:'cube',t:T('Quader 80 × 40 × 10 mm · Ecken 5 mm','Box 80 × 40 × 10 mm · corners 5 mm'),sub:T('vorher 40 mm breit','was 40 mm wide'),st:'edit',go:'rund'},{ic:'hole',t:T('Loch Ø 6 mm durchgehend','Hole Ø 6 mm through'),sub:T('10 mm vom linken Rand','10 mm from left edge'),st:'ok',go:'rund'}];
    default: return [q('ok'),r('ok'),tx('ok'),lo('ok')];
  }
}
function stBadge(st){
  return st==='ok'?`<span class="st ok">${icon('ok')}<span class="sr">${T('in Ordnung','ok')}</span></span>`
   : st==='edit'?`<span class="st edit" title="${T('wird bearbeitet','editing')}">${icon('pencil')}<span class="sr">${T('wird bearbeitet','editing')}</span></span>`
   : st==='bad'?`<span class="st bad" title="${T('geht nicht','fails')}">${icon('warn')}<span class="sr">${T('geht nicht','fails')}</span></span>`
   : `<span class="st warn" title="${T('braucht Hilfe','needs help')}">${icon('warn')}<span class="sr">${T('braucht Hilfe','needs help')}</span></span>`;
}
function bodies(){
  const id=S.scene; if(['leer','start','karte'].includes(id)) return [];
  const b=[{k:'box',n:T('Quader','Box'),c:COL.white}];
  if(['text','loch','druckcheck','fehler','suche'].includes(id)) b.push({k:'text',n:T('Text „LENA“','Text “LENA”'),c:COL.red});
  if(['loch','druckcheck','fehler','suche'].includes(id)) b.push({k:'hole',n:T('Loch Ø 5 mm','Hole Ø 5 mm'),hole:true});
  if(id==='rund') b.push({k:'hole',n:T('Loch Ø 6 mm','Hole Ø 6 mm'),hole:true});
  return b;
}
function renderLeft(){
  const L=$('#left');
  if(S.scene==='karte'){ L.innerHTML=`<div class="ph">${T('Baukasten','Kit')} · ${KSTEPS[S.kitStep-1][S.lang==='de'?0:1]}</div><div class="pbody">${kitPanel()}</div>`; return; }
  if(S.lc && S.variant==='A'){ L.innerHTML=`<div class="rail"><button class="iconbtn" data-act="collapse" data-arg="lc" aria-label="${T('Rezept ausklappen','Expand recipe')}">${icon('right')}</button><span class="vt">${T('Rezept','Recipe')}</span></div>`; return; }
  const R=recipe(), B=bodies();
  L.innerHTML=`<div class="ph"><span>${T('Rezept','Recipe')}</span><button class="iconbtn" data-act="collapse" data-arg="lc" aria-label="${T('Rezept einklappen','Collapse recipe')}">${icon('left')}</button></div>
  <div class="pbody">
    ${R.length?`<ol class="rc">${R.map((e,i)=>`<li><button class="ri ${e.st}" data-act="scene" data-arg="${e.go}" title="${T('Klicken zum Bearbeiten','Click to edit')}">
      <span class="num">${CIRC[i]}</span>${icon(e.ic)}<span class="rt">${e.t}${e.st==='bad'?`<small class="stw bad">${T('geht nicht','fails')}${e.sub?' · '+e.sub:''}</small>`:e.st==='edit'?`<small class="stw edit">${T('wird bearbeitet','editing')}${e.sub?' · '+e.sub:''}</small>`:e.sub?`<small>${e.sub}</small>`:''}</span>${stBadge(e.st)}</button></li>`).join('')}</ol>`
      :`<p class="empty">${T('Noch keine Schritte. Jede Änderung landet hier als Satz und bleibt änderbar.','No steps yet. Every change appears here as a sentence and stays editable.')}</p>`}
    <div class="now" role="separator" tabindex="0" aria-label="${T('Zeitmarker, ziehen zum Zurückblättern','Time marker, drag to look back')}" title="${T('Zeitmarker: zurückziehen, um einen früheren Stand zu sehen','Time marker: drag back to see an earlier state')}">${T('jetzt','now')}</div>
    <div class="bodies-sec">
      <div class="ptitle"><span>${T('Körper','Bodies')}</span></div>
      ${B.length?B.map(b=>`<div class="bd ${S.hide[b.k]?'off':''}"><button class="iconbtn" data-act="eye" data-arg="${b.k}" aria-label="${T('Sichtbarkeit','Visibility')}: ${b.n}" aria-pressed="${!S.hide[b.k]}">${icon(S.hide[b.k]?'eyeoff':'eye')}</button>
        <span class="sw ${b.hole?'holes':''}" ${b.hole?'':`style="background:rgb(${b.c.join(',')})"`}></span><span class="nm">${b.n}${b.hole?` <small style="color:var(--fg-3)">· ${T('als Loch','as hole')}</small>`:''}</span></div>`).join('')
        :`<p class="empty">${T('Noch keine Körper.','No bodies yet.')}</p>`}
    </div>
  </div>`;
}

    ${o.note!==undefined?`<div class="fl-note" id="${id}-n">${o.note}</div>`:`<div class="fl-bar"><i style="width:${o.pct??40}%"></i></div>`}</div>`;
}

   +field('f-d',T('Tiefe','Depth'),fmt(d),'mm',{bind:'d',pct:d/2.56,cls:active==='d'?'active':''})

    fehler:[T('Das Modell zeigt den letzten gültigen Stand. Wähle eine Lösung in der Meldung oder ändere den Wert.','The model shows the last valid state. Pick a fix in the message or change the value.'),[['⌘Z',T('rückgängig','undo')]]],
    suche:[T('Suche mit deinen eigenen Worten. ↑ ↓ wählt, Enter startet das Werkzeug, Esc schließt.','Search in your own words. ↑ ↓ selects, Enter starts the tool, Esc closes.'),[['↑↓',T('wählen','select')],['Esc',T('schließen','close')]]],

function model(){
  const id=S.scene, K={w:50,d:20,h:4,r:4,text:true,hole:true,holeX:-20,holeDia:5};
  let m;
  switch(id){
    case 'leer': m={empty:true,cam:{zoom:1}}; break;
    case 'quader': m={w:34,d:20,h:20,r:0,cam:{zoom:3.3,tx:4,ty:4,tz:6}}; break;
    case 'tippen': { const t=S.typed||{w:50,d:20,h:4}; m={w:t.w,d:t.d,h:t.h,r:0,cam:{zoom:4.4,tx:3,ty:-2,tz:3}}; break; }
    case 'abrunden': m={...K,text:false,hole:false,cam:{zoom:5,tx:0,ty:0,tz:2}}; break;
    case 'text': m={...K,hole:false,cam:{zoom:5,tx:0,ty:0,tz:2}}; break;
    case 'loch': m={...K,hole:S.holeOn,ghost:S.holeOn,solid:!S.holeOn,cam:{zoom:5,tx:-3,ty:0,tz:3}}; break;
    case 'rund': m={w:80,d:40,h:10,r:5,x0:20,hole:true,holeX:-10,holeDia:6,cam:{zoom:2.5,tx:20,ty:0,tz:5}}; break;
    case 'karte': m={card:true,cam:{zoom:1.7,a:-22,e:54,tx:0,ty:-6,tz:0}}; break;
    default: m={...K,cam:{zoom:5,tx:0,ty:0,tz:2}};
  }
  for(const k of ['w','d','h','r']) if(S.edits[k]!=null && !m.empty && !m.card) m[k]=S.edits[k];
  if(m.r>=Math.min(m.w,m.d)/2) m.r=Math.min(m.w,m.d)/2-0.05;
  return m;
}

let O; // overlay accumulator for the current frame
function at(P,html,cls='',attrs=''){

const cursorAt=P=>`<path class="cursor" transform="translate(${r1(P[0])},${r1(P[1])})" d="M0 0 L0 17 L4.5 13 L7.6 19.6 L10.2 18.4 L7.2 11.9 L13 11.9 Z"/>`;
const hdl=(P,cls='',sz=10)=>`<rect class="hdl ${cls}" x="${r1(P[0]-sz/2)}" y="${r1(P[1]-sz/2)}" width="${sz}" height="${sz}" rx="2" data-act="mock" data-msg="${T('Maß-Griff: ziehen ändert das Maß','Size handle: drag to change the measure')}"/>`;
function line(A,B,cls){return `<line x1="${r1(A[0])}" y1="${r1(A[1])}" x2="${r1(B[0])}" y2="${r1(B[1])}" class="${cls}"/>`;}
function arrow(A,B,cls='accl'){const a=Math.atan2(B[1]-A[1],B[0]-A[0]),l=9;
  return line(A,B,cls)+`<path class="${cls}" d="M${r1(B[0]-l*Math.cos(a-0.45))} ${r1(B[1]-l*Math.sin(a-0.45))} L${r1(B[0])} ${r1(B[1])} L${r1(B[0]-l*Math.cos(a+0.45))} ${r1(B[1]-l*Math.sin(a+0.45))}"/>`;}
function dimLine(C,p1,p2,ext1,ext2){ // 3D points; ext = 3D origin of extension line
  const A=C.p(...p1),B=C.p(...p2); let s='';
  if(ext1) s+=line(C.p(...ext1),A,'dim-ext'); if(ext2) s+=line(C.p(...ext2),B,'dim-ext');
  const a=Math.atan2(B[1]-A[1],B[0]-A[0]), n=[-Math.sin(a)*5,Math.cos(a)*5];
  return s+line(A,B,'dim')+line([A[0]-n[0],A[1]-n[1]],[A[0]+n[0],A[1]+n[1]],'dim')+line([B[0]-n[0],B[1]-n[1]],[B[0]+n[0],B[1]+n[1]],'dim');
}
function drawBed(C,m){
  const bedRGB=getComputedStyle(document.documentElement).getPropertyValue('--bed-rgb').split(',').map(Number);
  const out=rrect(256,256,6), sides=prismFaces(out,-5,0).filter(f=>!f.top);
  const id=uid('bed'), top=ptsAttr(C,out.map(p=>[p[0],p[1],0]));
  let s=drawPoly(C,sides,bedRGB.map(c=>c*0.8))+`<clipPath id="${id}"><polygon points="${top}"/></clipPath><polygon points="${top}" class="bed-top"/>`;
  const g=C.s>5?5:10, maj=g===5?10:50;
  s+=`<g clip-path="url(#${id})">`;
  for(let v=-125;v<=125;v+=g){ if(v===0) continue; const c=Math.abs(v)%maj===0?'grid major':'grid';
    s+=line(C.p(v,-128,0),C.p(v,128,0),c)+line(C.p(-128,v,0),C.p(128,v,0),c); }
  s+=line(C.p(-128,0,0),C.p(128,0,0),'ax-x')+line(C.p(0,-128,0),C.p(0,128,0),'ax-y')+`</g><polygon points="${top}" class="bed-rim"/>`;
  const o=C.p(0,0,0); s+=`<circle cx="${r1(o[0])}" cy="${r1(o[1])}" r="3" class="origin"/>`;
  if(C.s<3.2){ const f=C.p(0,-128,0), rr=C.p(128,0,0), fl=C.p(-128,-128,0);
    s+=`<text class="bedlabel" x="${r1(f[0])}" y="${r1(f[1]+24)}" text-anchor="middle">256 mm</text><text class="bedlabel" x="${r1(rr[0]+10)}" y="${r1(rr[1]+20)}">256 mm</text>

  return s;
}
function drawKeychain(C,m){

  let s='';
  F.filter(f=>dot(newell(f.pts),C.toCam)>0.02).sort((a,b)=>C.depth(...a.c)-C.depth(...b.c)).forEach(f=>{
    const o=C.p(...f.c), pu=C.p(f.c[0]+f.u[0],f.c[1]+f.u[1],f.c[2]+f.u[2]), pv=C.p(f.c[0]+f.v[0],f.c[1]+f.v[1],f.c[2]+f.v[2]);
    const M=[pu[0]-o[0],pu[1]-o[1],pv[0]-o[0],pv[1]-o[1],o[0],o[1]].map(x=>Math.round(x*1000)/1000).join(' ');
    s+=`<polygon class="vc-face" points="${ptsAttr(C,f.pts)}" data-act="view" data-arg="${f.k}"><title>${f.l}</title></polygon><text class="vc-t" transform="matrix(${M})" font-size="${f.l.length>5?0.36:0.44}" text-anchor="middle" dominant-baseline="central">${f.l}</text>`;});
  const A=cam({a:S.cam.a,e:S.cam.e,s:13,cx:16,cy:116,tx:0,ty:0,tz:0}), o=A.p(0,0,0);
  [['x',[1,0,0],'var(--ax-x)'],['y',[0,1,0],'var(--ax-y)'],['z',[0,0,1],'var(--ax-z)']].forEach(([n,d,col])=>{const e=A.p(...d);
    s+=`<line x1="${r1(o[0])}" y1="${r1(o[1])}" x2="${r1(e[0])}" y2="${r1(e[1])}" style="stroke:${col}" stroke-width="2" stroke-linecap="round"/><text x="${r1(e[0]+(e[0]-o[0])*0.35)}" y="${r1(e[1]+(e[1]-o[1])*0.35)}" font-size="12" font-weight="700" style="fill:${col}" text-anchor="middle" dominant-baseline="central">${n.toUpperCase()}</text>`;});
  $('#cube').innerHTML=`<svg width="112" height="134" viewBox="0 0 112 134" role="group" aria-label="${T('Ansichtswürfel','View cube')}">${s}</svg>
    <div class="cube-btns"><button class="iconbtn" data-act="view" data-arg="home" aria-label="${T('Startansicht (Pos1)','Home view (Home)')}" title="${T('Startansicht (Pos1)','Home view (Home)')}">${icon('home')}</button></div>`;
}
let camAnim=0;
function animateCam(to){
  cancelAnimationFrame(camAnim);
  if(RM()){ S.cam={...to}; renderView(); return; }
  const from={...S.cam}; let da=to.a-from.a; while(da>180) da-=360; while(da<-180) da+=360;
  const t0=performance.now(), dur=230;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    S.cam={a:from.a+da*e,e:from.e+(to.e-from.e)*e}; renderView(); if(k<1) camAnim=requestAnimationFrame(step); };
  camAnim=requestAnimationFrame(step);
}

function positionFlyout(){
  const f=$('#fly'), b=document.querySelector(`.grp[data-arg="${S.flyout}"]`); if(!f||!b) return;
  const vr=$('#view').getBoundingClientRect(), br=b.getBoundingClientRect();

const normq=s=>s.toLowerCase().trim();
function searchTools(q){
  q=normq(q); const L=S.lang;
  if(!q) return TOOLS.slice(0,5).map(t=>({t,why:null}));
  const res=[];
  for(const t of TOOLS){
    const name=normq(t[L]); let score=0, why=null;
    if(name.startsWith(q)) score=3; else if(name.includes(q)) score=2.5;
    else { for(const s of [...t.syn[L],...t.syn[L==='de'?'en':'de']]){ const words=q.split(/\s+/);
      if(s.includes(q)||q.includes(s)){ score=2; why=s; break; }
      if(words.every(w=>s.split(/\s+/).some(x=>x.startsWith(w)))){ score=1.5; why=s; break; } } }
    if(score) res.push({t,why,score});
  }
  return res.sort((a,b)=>b.score-a.score);
}
function searchHtml(){
  if(!S.search || !WORK(S.scene)) return '';
  const R=searchTools(S.search.q); S.search.n=R.length; const sel=Math.min(S.search.sel,Math.max(0,R.length-1));
  const hi=(txt,q)=>{const i=normq(txt).indexOf(normq(q)); return q&&i>=0?txt.slice(0,i)+'<mark>'+txt.slice(i,i+q.length)+'</mark>'+txt.slice(i+q.length):txt;};
  return `<div class="cmd" role="dialog" aria-label="${T('Befehlssuche','Command search')}">
    <div class="cmd-in">${icon('search')}<input id="cmdq" value="${S.search.q.replace(/"/g,'&quot;')}" placeholder="${T('Was möchtest du tun? z. B. „runde ecken“','What do you want to do? e.g. “round corners”')}" role="combobox" aria-expanded="true" aria-controls="cmdres" aria-autocomplete="list" autocomplete="off"><kbd>Esc</kbd></div>
    <ul class="cmd-res" id="cmdres" role="listbox">${R.length?R.map((r,i)=>`<li role="option" aria-selected="${i===sel}" data-act="cmdpick" data-arg="${i}">
      <span class="ci">${icon(r.t.ic)}</span><span><span class="cn">${hi(r.t[S.lang],S.search.q)}</span> <span class="cg">· ${T(...r.t.g)}</span>
      <span class="why">${r.why?`${T('gefunden über','found via')} „${hi(r.why,S.search.q)}“ · `:''}${T(...r.t.d)}</span></span>${r.t.k?`<kbd>${r.t.k}</kbd>`:'<span></span>'}</li>`).join('')
      :`<li aria-disabled="true"><span class="ci">${icon('info')}</span><span>${T('Nichts gefunden. Probier ein anderes Wort, z. B. „rund“ oder „loch“.','Nothing found. Try another word, e.g. “round” or “hole”.')}</span><span></span></li>`}</ul>
    <div class="cmd-try">${T('Probier:','Try:')} ${(S.lang==='de'?['runde ecken','hohl','schraube','namen','knete']:['round corners','hollow','screw','name','clay']).map(w=>`<button data-act="tryq" data-arg="${w}">${w}</button>`).join('')}</div></div>`;
}
function refreshSearch(){
  const ov=$('#ov'), old=ov.querySelector('.cmd'); if(!old){ renderView(); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=searchHtml();
  const res=tmp.querySelector('#cmdres'); old.querySelector('#cmdres').replaceWith(res);

  if(RM()){ S.typed={w:50,d:20,h:4,f:null,txt:{},done:true,ki:seq.length}; renderAll(); return; }
  S.typed={w:34,d:20,h:20,f:'w',txt:{w:''},done:false,ki:-1}; renderAll();
  seq.forEach((k,i)=>S.timers.push(setTimeout(()=>{
    const t=S.typed; t.ki=i;
    if(k.f){ t.f=k.f; t.txt[k.f]=k.v; t[k.f]=parseFloat(k.v); }
    else if(k.l.includes('Tab')){ t.f=t.f==='w'?'d':'h'; t.txt[t.f]=''; }
    else { t.done=true; t.f=null; }
    renderAll();
  },700+i*520)));
}
function go(id){
  if(!SCENES.some(s=>s.id===id)) return;
  clearTimers(); S.scene=id; S.edits={}; S.hide={}; S.typed=null; S.errorFixed=false; S.editDim=false; S.holeOn=true;
  S.flyout=id==='quader'?'formen':null;
  S.search=id==='suche'?{q:T('runde ecken','round corners'),sel:0}:null;
  const c=model().cam; S.cam={a:c.a??-30,e:c.e??36};
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  renderAll();
  if(id==='tippen') startTyping();
}
const stepScene=d=>{const i=SCENES.findIndex(s=>s.id===S.scene); go(SCENES[clamp(i+d,0,SCENES.length-1)].id);};
const ACT={
  scene:v=>go(v), next:()=>stepScene(1), prev:()=>stepScene(-1),
  variant:v=>{S.variant=v; renderAll(); if(!WORK(S.scene)) toast(T('Die Variante gilt nur für die Arbeitsansicht.','The variant only applies to the work view.'));},
  theme:v=>{S.theme=v; renderAll();}, lang:v=>{S.lang=v; if(S.search&&S.scene==='suche') S.search.q=T('runde ecken','round corners'); renderAll();},
  accent:v=>{S.accent=v; renderAll();}, info:()=>{S.info=!S.info; renderAll();},
  group:v=>{S.flyout=S.flyout===v?null:v; S.search=null; renderAll();}, closefly:()=>{S.flyout=null; renderAll();},
  flyhole:()=>{S.flyHole=!S.flyHole; renderAll();},
  shape:v=>{ if(v==='quader'){ if(S.scene!=='quader') go('quader'); } else toast(T('Im Mockup ist nur der Quader ausgearbeitet.','Only the box is worked out in this mockup.')); },
  kit:v=>{ if(v==='karte') go('karte'); else toast(T('Dieser Baukasten ist im Mockup nicht ausgearbeitet.','This kit is not worked out in this mockup.')); },
  tile:v=>{ if(v==='leer') go('leer'); else if(v==='karte') go('karte'); else if(v==='recent') go('druckcheck'); else toast(T('Im Mockup nicht ausgearbeitet. Ausprobieren: „Karte“ oder „Leer“.','Not worked out in this mockup. Try “Card” or “Empty”.')); },
  view:v=>animateCam(VIEWS[v]),
  eye:v=>{S.hide[v]=!S.hide[v]; renderAll();},
  holeSw:()=>{S.holeOn=!S.holeOn; renderAll(); toast(S.holeOn?T('Als Loch: an. Die Form schneidet sofort aus.','As Hole: on. The shape cuts right away.'):T('Als Loch: aus. Die Form ist jetzt ein normaler Körper.','As Hole: off. The shape is now a normal body.'));},
  fix:v=>{ if(v==='max'){S.errorFixed=true; renderAll(); toast(T('Erledigt: Rundung jetzt 3,9 mm. Rückgängig mit ⌘Z.','Done: rounding is now 3.9 mm. Undo with ⌘Z.'));}
    else if(v==='skip'){S.errorFixed=true; renderAll(); toast(T('Erledigt: Diese Kante bleibt eckig.','Done: this edge stays sharp.'));}
    else { setTimeout(()=>{const f=$('#f-rad2'); f?.focus(); f?.select();},0); } },
  fixtip:()=>toast(T('Erledigt: Das Loch sitzt jetzt 5,5 mm vom Rand. Rückgängig mit ⌘Z.','Done: the hole is now 5.5 mm from the edge. Undo with ⌘Z.')),
  mock:(v,t)=>toast(t.dataset.msg||T('Im Mockup nur angedeutet.','Only hinted at in this mockup.')),
  ochk:(v,t)=>{t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');},
  replay:()=>startTyping(), search:()=>openSearch(),
  tryq:v=>{S.search.q=v; S.search.sel=0; renderView(); const i=$('#cmdq'); i?.focus(); i?.setSelectionRange(v.length,v.length);},
  cmdpick:v=>{ const r=searchTools(S.search.q)[+v]; if(!r) return; S.search=null;
    if(r.t.de==='Abrunden') go('abrunden'); else if(r.t.de==='Text') go('text'); else if(r.t.de==='Druckcheck') go('druckcheck');
    else { renderAll(); toast(`${T(r.t.de,r.t.en)}: ${T('Werkzeug startet (im Mockup nicht ausgearbeitet).','tool starts (not worked out in this mockup).')}`); } },
  kitstep:v=>{S.kitStep=+v; renderAll();},
  kopt:v=>{const [g,val]=v.split(':'); S.kit[g]=val; renderAll();},
  collapse:v=>{S[v]=!S[v]; renderAll();},
  editdim:()=>{S.editDim=true; renderView(); setTimeout(()=>{const i=$('#dimedit'); i?.focus(); i?.select();},0);}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t || t.disabled) return;
  const f=ACT[t.dataset.act]; if(f){ e.preventDefault(); f(t.dataset.arg,t,e); }
});
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName, inField=/INPUT|SELECT|TEXTAREA/.test(tag);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(e.target.id==='cmdq'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); S.search.sel=clamp(S.search.sel+(e.key==='ArrowDown'?1:-1),0,Math.max(0,(S.search.n||1)-1)); refreshSearch(); return; }
    if(e.key==='Enter'){ e.preventDefault(); ACT.cmdpick(String(S.search.sel)); return; }
  }
  if(e.key==='Escape'){ if(S.search){S.search=null; renderAll(); return;} if(S.flyout){S.flyout=null; renderAll(); return;} if(S.info){S.info=false; renderAll(); return;} if(S.editDim){S.editDim=false; renderView(); return;} }
  if(e.target.id==='dimedit' && e.key==='Enter'){ const v=parseExpr(e.target.value); S.editDim=false; renderView(); toast(isNaN(v)?T('Das verstehe ich nicht. Beispiele: 5, 2,5 cm, 10/2','I do not understand that. Examples: 5, 2.5 cm, 10/2'):T(`Loch sitzt jetzt ${fmt(v)} mm vom Rand.`,`Hole is now ${fmt(v)} mm from the edge.`)); return; }
  if(e.key==='Enter' && e.target.matches('[role="button"]')){ e.target.click(); return; }
  if(inField) return;
  if(e.key==='ArrowRight'){ stepScene(1); } else if(e.key==='ArrowLeft'){ stepScene(-1); } else if(e.key==='Home' && WORK(S.scene)){ animateCam(VIEWS.home); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='cmdq'){ S.search.q=e.target.value; S.search.sel=0; refreshSearch(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='scsel'){ go(el.value); return; }
  if(el.matches('.fl-in input') && el.id!=='f-txt'){
    const v=parseExpr(el.value), note=document.getElementById(el.id+'-n'), fld=el.closest('.fld');
    if(isNaN(v)){ fld.classList.add('err'); toast(T('Das verstehe ich nicht. Beispiele: 25+3, 2,5 cm, 1 in, Breite/2','I do not understand that. Examples: 25+3, 2.5 cm, 1 in, Width/2')); return; }
    fld.classList.remove('err'); const shown=fmt(Math.round(v*100)/100);
    if(el.value.trim()!==shown) toast(`${el.value.trim()} = ${shown} ${el.dataset.unit||''}`);
    el.value=shown; if(note) note.textContent='';
    if(el.dataset.bind){ S.edits[el.dataset.bind]=Math.max(0.1,v); renderView(); }
  }
});
let tipTimer; const tipEl=$('#tipcard');
function showTip(el){ clearTimeout(tipTimer); tipTimer=setTimeout(()=>{ const r=el.getBoundingClientRect();
  tipEl.innerHTML=`<b>${el.dataset.tipT||''}</b>${el.dataset.tip}<div class="tk"><span class="vtag">${T('Karte mit Animation folgt','card with animation to come')}</span></div>`; tipEl.hidden=false;
  tipEl.style.left=clamp(r.left,8,innerWidth-262)+'px'; tipEl.style.top=(r.bottom+8+tipEl.offsetHeight>innerHeight?r.top-tipEl.offsetHeight-8:r.bottom+8)+'px'; },800); }
function hideTip(){ clearTimeout(tipTimer); tipEl.hidden=true; }
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'); if(t) showTip(t); else hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]'); if(t) showTip(t); else hideTip();});
document.addEventListener('mouseleave',hideTip);

function renderAll(){
  const fid=document.activeElement?.id;
  const R=document.documentElement; R.dataset.theme=S.theme; R.dataset.accent=S.accent; R.lang=S.lang;
  renderDemo();
  const app=$('#app'), work=WORK(S.scene);
  app.className=[S.scene==='karte'?'kit':'', work&&S.variant==='B'?'vb':'', work&&S.variant==='A'&&S.lc?'lc':'', work&&S.variant==='A'&&S.rc?'rc':''].join(' ').trim();
  $('#right').style.display=''; $('#right').style.left=''; $('#right').style.top='';
  $('#start').hidden=S.scene!=='start';
  if(S.scene==='start') renderStart();
  else { renderTop(); renderOpts(); renderLeft(); renderRight(); renderHint(); renderView(); }
  renderInfo();
  if(fid){ const el=document.getElementById(fid); if(el && el!==document.activeElement) el.focus(); }
}
addEventListener('resize',()=>{ renderView(); positionFlyout(); });
(function boot(){
  const h=(location.hash||'').slice(1);
  renderAll(); go(SCENES.some(s=>s.id===h)?h:'start');
})();
</script>
