      <button class="btn" data-act="scene" data-arg="loch">${T('Abbrechen','Cancel')}</button>
      <button class="btn" data-act="mock" data-msg="${T('Gespeichert (Attrappe).','Saved (dummy).')}">${icon('download')} ${T('Speichern','Save')}</button>
      ${S.exp.purpose==='druck'?`<button class="btn primary" data-act="mock" data-msg="${T('Öffnet den Slicer mit allen Farben (Attrappe).','Opens the slicer with all colours (dummy).')}">${icon('slicer')} ${T('Im Slicer öffnen','Open in Slicer')}</button>`:''}</div>
  </div>`;
}

/* ======================= info drawer ======================= */
function renderInfo(){
  const I=$('#info'); I.hidden=!S.info; if(!S.info) return;
  const v=$('#view').getBoundingClientRect(), a=$('#app').getBoundingClientRect();
  const pct=WORK(S.scene)?Math.round(v.width*v.height/(a.width*a.height)*100):null;
  I.innerHTML=`<div class="ih"><h2>${T('Über dieses Mockup','About this mockup')}</h2><button class="iconbtn" data-act="info" aria-label="${T('Schließen','Close')}">${icon('x')}</button></div>
  <p>${T('Eine Attrappe zum Anschauen und Durchklicken: keine echte Geometrie, kein Speichern. Die gestrichelte Leiste oben gehört nicht zum Programm. Schilder „Vorschlag“ markieren Ideen, die nicht in den Projektdokumenten stehen.','A clickable dummy: no real geometry, no saving. The dashed strip at the top is not part of the app. “Proposal” tags mark ideas that are not in the project documents.')}</p>
  <h3>${T('Szenen','Scenes')}</h3><div class="slist">${SCENES.map((s,i)=>`<button data-act="scene" data-arg="${s.id}" aria-current="${s.id===S.scene}">${i+1}. ${s.t()}</button>`).join('')}</div>
  <h3>${T('Zwei Griff-Arten','Two handle styles')}</h3>
  <p>${T('Entschieden: Beide bleiben. Jede:r stellt sie unter Einstellungen ▸ Griffe ein (Zahnrad oben rechts, ⌘,). Die Mockup-Leiste schaltet zum Vergleichen schnell um.','Decided: both stay. Everyone picks one under Settings ▸ Handles (gear top right, ⌘,). The mockup strip switches quickly for comparison.')}</p>
  <h3>${T('Akzentfarbe','Accent colour')}</h3><p>${T('Entschieden: frei wählbar unter Einstellungen ▸ Aussehen, mit Vorschlägen und eigener Farbe. Fission3D leitet daraus alle Akzenttöne ab und hält dabei den Kontrast (WCAG AA). Ähnelt die Farbe Rot, Gelb oder Grün, erscheint ein Hinweis, weil diese Farben schon Bedeutungen haben.','Decided: free choice under Settings ▸ Appearance, with suggestions and a custom colour. Fission3D derives all accent shades and keeps contrast (WCAG AA). If the colour resembles red, yellow or green, a hint appears because those colours already carry meaning.')}</p>
  <ul><li><b>${T('Achsen','Axes')}</b> ${T('(Standard): farbige Pfeile X/Y/Z zum Verschieben, Maßbänder an den Kanten zum Tippen, blaue Punkte zum Ziehen von Flächen (Werkzeug „Größe“). Wirkt wie ein CAD-Programm.','(default): coloured X/Y/Z arrows to move, measure bands along the edges for typing, blue dots to pull faces (tool “Size”). Feels like a CAD program.')}</li>
   <li><b>${T('Klassisch','Classic')}</b>: ${T('weiße Eck-Quadrate, Hebe-Pfeil, Maßkästchen. Vertraut für Tinkercad-Umsteiger.','white corner squares, lift arrow, measure boxes. Familiar to Tinkercad switchers.')}</li></ul>
  <p>${T('Beide Arten ändern Maße gleich: Löcher und Rundungen bleiben rund, jede Zahl ist eintippbar.','Both styles change sizes the same way: holes and roundings stay round, every number can be typed.')}</p>
  <h3>${T('Aus der Vorlage „Formwerk“ übernommen','Taken from the “Formwerk” reference')}</h3>
  <ul><li>${T('Dunkles, ruhiges Farbschema mit Blau als Akzent, IBM Plex als Schrift.','Dark, calm colour scheme with blue accent, IBM Plex type.')}</li>
   <li>${T('Werkzeugpalette links in der 3D-Ansicht, Darstellung oben, Ansichtswürfel oben rechts.','Tool palette on the left of the 3D view, display modes on top, view cube top right.')}</li>
   <li>${T('Lernkarte unten in der Mitte → bei uns der „Lotse“ der Missionen.','Learning card at the bottom → our missions “guide”.')}</li>
   <li>${T('Startseite mit Weitermachen, Zuletzt, Vorlagen → bei uns Baukästen und Missionen.','Start page with continue, recent, templates → our kits and missions.')}</li>
   <li>${T('Export-Assistent mit Zweck, Format, Prüfungen und Vorschau → bei uns Druckcheck & Export.','Export assistant with purpose, format, checks and preview → our print check & export.')}</li></ul>
  <h3>${T('Bewusst anders als die Vorlage','Deliberately different from the reference')}</h3>
  <ul><li>${T('„Szene“ heißt „Körper“, „Verlauf“ heißt „Rezept“ (Glossar).','“Scene” is “Bodies”, “History” is “Recipe” (glossary).')}</li>
   <li>${T('Kein Rendern, keine Spiel-Engine, keine cm-Einheit als Standard: Wir bauen für den 3D-Druck, in mm.','No rendering, no game engine, no cm default: we build for 3D printing, in mm.')}</li>
   <li>${T('Fehler und Druckcheck-Hinweise erscheinen am Modell, nicht als Fenster. Der Export-Assistent ist ein Fenster, weil Speichern keine Geometrie-Operation ist.','Errors and print check hints appear on the model, not as windows. The export assistant is a window because saving is not a geometry operation.')}</li></ul>
  <h3>${T('Offene Entscheidungen','Open decisions')}</h3>
  <ul><li>${T('„Geführt | Experte“ oben rechts stammt aus der Vorlage. Design-Prinzip 8 sagt: kein getrennter Anfänger- und Profimodus. Hier blendet „Experte“ nur den Lotsen aus, alle Werkzeuge bleiben gleich.','“Guided | Expert” top right comes from the reference. Design principle 8 says: no separate beginner and pro mode. Here “Expert” only hides the guide, all tools stay the same.')}</li>
   <li>${T('Welche Griffe beim ersten Start voreingestellt sind (Vorschlag: Achsen; die Frage „Maus-Stil wie Tinkercad“ beim ersten Start könnte Klassisch wählen).','Which handles are preset on first start (proposal: Axes; choosing “mouse style like Tinkercad” on first start could pick Classic).')}</li>
   <li>${T('Fläche der 3D-Ansicht (siehe unten). Mit „Fokus“ (Knopf unter dem Ansichtswürfel, Taste F) verschwinden beide Seitenleisten.','3D view area (see below). “Focus” (button below the view cube, key F) hides both side panels.')}</li></ul>
  ${pct!==null?`<h3>${T('Fläche der 3D-Ansicht','3D view area')}</h3><p><span class="pct">${pct} %</span> ${T('des Programmfensters in dieser Szene und Fenstergröße. Ziel laut UX-Konzept: mindestens 65 % auf einem 13"-Laptop.','of the app window in this scene and window size. Target in the UX concept: at least 65 % on a 13" laptop.')}</p>`:''}
  <h3>${T('Was das Mockup nicht zeigt','What this mockup does not show')}</h3>
  <ul><li>${T('Echte Geometrie: Ansicht drehen nur über den Ansichtswürfel, Maße ändern das Bild nur teilweise.','Real geometry: rotating only via the view cube, measures only partly change the picture.')}</li>
   <li>${T('Skizzen, Muster, Deko-Werkzeuge (außer Text), Bausteine, Benannte Maße als Tabelle, Baukästen Vase und Figur.','Sketches, repeat, decorate tools (except text), building blocks, named measures table, vase and figure kits.')}</li>
   <li>${T('Erster Start, Speichern, Rückgängig, Slicer-Übergabe (Knöpfe sind Attrappen).','First start, saving, undo, slicer hand-off (buttons are dummies).')}</li></ul>`;
}

/* ======================= actions, keyboard, boot ======================= */
const TYPESEQ=()=>[{l:'5',f:'w',v:'5'},{l:'0',f:'w',v:'50'},{l:'⇥ Tab'},{l:'2',f:'d',v:'2'},{l:'0',f:'d',v:'20'},{l:'⇥ Tab'},{l:'4',f:'h',v:'4'},{l:'⏎ Enter'}];
function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
function startTyping(){
  clearTimers(); const seq=TYPESEQ();
  if(RM()){ S.typed={w:50,d:20,h:4,f:null,txt:{},done:true,ki:seq.length}; renderAll(); return; }
  S.typed={w:34,d:20,h:20,f:'w',txt:{w:''},done:false,ki:-1}; renderAll();
  seq.forEach((k,i)=>S.timers.push(setTimeout(()=>{
    const t=S.typed; t.ki=i;
    if(k.f){ t.f=k.f; t.txt[k.f]=k.v; t[k.f]=parseFloat(k.v); }
    else if(k.l.includes('Tab')){ t.f=t.f==='w'?'d':'h'; t.txt[t.f]=''; }
    else { t.done=true; t.f=null; t.ki=seq.length; }
    renderAll();
  },700+i*520)));
}
function go(id){
  if(!SCENES.some(s=>s.id===id)) return;
  if(id!=='start'){ S.back=null; S.startPage='home'; }
  clearTimers(); S.scene=id; S.edits={}; S.hide={}; S.typed=null; S.errorFixed=false; S.editDim=false; S.holeOn=true; S.lotse=true;
  S.exp.fixed=false; S.tool={rund:'groesse',abrunden:'waehlen',fehler:'waehlen'}[id]||'verschieben';
  S.flyout=id==='quader'||id==='leer'?'formen':null;
  S.search=id==='suche'?{q:T('runde ecken','round corners'),sel:0}:null;
  const c=model().cam; S.cam={a:c.a??-30,e:c.e??36};
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  renderAll();
  if(id==='tippen') startTyping();
}
const stepScene=d=>{const i=SCENES.findIndex(s=>s.id===S.scene); go(SCENES[clamp(i+d,0,SCENES.length-1)].id);};
const ACT={
  none:()=>{},
  scene:v=>go(v), next:()=>stepScene(1), prev:()=>stepScene(-1),
  handles:v=>{S.handles=v; renderAll(); toast(v==='achsen'?T('Griffe: Achsen – Pfeile X/Y/Z und Maßbänder.','Handles: Axes – X/Y/Z arrows and measure bands.'):T('Griffe: Klassisch – Eck-Quadrate wie in Tinkercad.','Handles: Classic – corner squares like Tinkercad.'));},
  theme:v=>{S.theme=v; renderAll();}, accent:v=>{S.accent=v; renderAll();},
  spage:v=>{S.startPage=v; if(v==='home') S.back=null; renderAll();},
  settings:()=>{ if(S.scene!=='start') S.back=S.scene; S.startPage='settings'; go('start'); }, lang:v=>{S.lang=v; if(S.search&&S.scene==='suche') S.search.q=T('runde ecken','round corners'); renderAll();},
  info:()=>{S.info=!S.info; renderAll();},
  mode:v=>{S.mode=v; S.lotse=true; renderAll(); toast(v==='experte'?T('Experte: Lotse und Erklär-Texte ausgeblendet. Alle Werkzeuge bleiben gleich.','Expert: guide and explanations hidden. All tools stay the same.'):T('Geführt: Der Lotse zeigt den nächsten Schritt.','Guided: the guide shows the next step.'));},
  disp:v=>{S.display=v; renderAll();},
  tool:v=>{S.tool=v; renderAll(); if(v!=='verschieben'&&v!=='groesse') toast(`${T(...TOOLNAMES[v])}: ${T('im Mockup nur angedeutet','only hinted at in this mockup')}`);},
  ltab:v=>{S.leftTab=v; S.flyout=null; renderAll();}, rtab:v=>{S.rightTab=v; renderAll();},
  lotse:()=>{S.lotse=!S.lotse; renderView();},
  focus:()=>{S.focus=!S.focus; renderAll();},
  group:v=>{S.flyout=S.flyout===v?null:v; S.search=null; renderAll();}, closefly:()=>{S.flyout=null; renderAll();},
  flyhole:()=>{S.flyHole=!S.flyHole; renderAll();},
  shape:v=>{ if(v==='quader'){ if(S.scene!=='quader') go('quader'); } else toast(T('Im Mockup ist nur der Quader ausgearbeitet.','Only the box is worked out in this mockup.')); },
  kit:v=>{ if(v==='karte') go('karte'); else toast(T('Dieser Baukasten ist im Mockup nicht ausgearbeitet.','This kit is not worked out in this mockup.')); },
  tile:v=>{ if(v==='leer') go('leer'); else if(v==='karte') go('karte'); else toast(T('Im Mockup nicht ausgearbeitet. Ausprobieren: „Karte“ oder „Leeres Druckbett“.','Not worked out in this mockup. Try “Card” or “Empty print bed”.')); },
  view:v=>animateCam(VIEWS[v]),
  eye:v=>{S.hide[v]=!S.hide[v]; renderAll();},
  holeSw:()=>{S.holeOn=!S.holeOn; renderAll(); toast(S.holeOn?T('Als Loch: an. Die Form schneidet sofort aus.','As Hole: on. The shape cuts right away.'):T('Als Loch: aus. Die Form ist jetzt ein normaler Körper.','As Hole: off. The shape is now a normal body.'));},
  fix:v=>{ if(v==='max'){S.errorFixed=true; renderAll(); toast(T('Erledigt: Rundung jetzt 3,9 mm. Rückgängig mit ⌘Z.','Done: rounding is now 3.9 mm. Undo with ⌘Z.'));}
    else if(v==='skip'){S.errorFixed=true; renderAll(); toast(T('Erledigt: Diese Kante bleibt eckig.','Done: this edge stays sharp.'));}
    else { setTimeout(()=>{const f=document.querySelector('#right input[data-bind="r"]')||$('#right input'); f?.focus(); f?.select();},0); } },
  purpose:v=>{S.exp.purpose=v; renderExport();}, fmt:v=>{S.exp.fmt=v; renderExport();},
  expfix:()=>{S.exp.fixed=true; renderExport(); toast(T('Erledigt: Das Loch sitzt jetzt 5,5 mm vom Rand. Rückgängig mit ⌘Z.','Done: the hole is now 5.5 mm from the edge. Undo with ⌘Z.'));},
  mock:(v,t)=>toast(t.dataset.msg||T('Im Mockup nur angedeutet.','Only hinted at in this mockup.')),
  toggle:(v,t)=>{t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');},
  replay:()=>startTyping(), search:()=>openSearch(),
  tryq:v=>{S.search.q=v; S.search.sel=0; renderSearch(); const i=$('#cmdq'); i?.focus(); i?.setSelectionRange(v.length,v.length);},
  cmdpick:v=>{ const r=searchTools(S.search.q)[+v]; if(!r) return; S.search=null;
    if(r.t.de==='Abrunden') go('abrunden'); else if(r.t.de==='Text') go('text'); else if(r.t.de==='Im Slicer öffnen'||r.t.de==='Druckcheck') go('export');
    else { renderAll(); toast(`${T(r.t.de,r.t.en)}: ${T('Werkzeug startet (im Mockup nicht ausgearbeitet).','tool starts (not worked out in this mockup).')}`); } },
  kitstep:v=>{S.kitStep=+v; renderAll();},
  kopt:v=>{const [g,val]=v.split(':'); S.kit[g]=val; renderAll();},
  editdim:()=>{S.editDim=true; renderView(); setTimeout(()=>{const i=$('#dimedit'); i?.focus(); i?.select();},0);}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t || t.disabled) return;
  const f=ACT[t.dataset.act]; if(f){ e.preventDefault(); e.stopPropagation(); f(t.dataset.arg,t,e); }
});
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName, inField=/INPUT|SELECT|TEXTAREA/.test(tag);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key===','){ e.preventDefault(); ACT.settings(); return; }
  if(e.target.id==='cmdq'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); S.search.sel=clamp(S.search.sel+(e.key==='ArrowDown'?1:-1),0,Math.max(0,(S.search.n||1)-1)); refreshSearch(); return; }
    if(e.key==='Enter'){ e.preventDefault(); ACT.cmdpick(String(S.search.sel)); return; }
  }
  if(e.key==='Escape'){ if(S.search){S.search=null; renderAll(); return;} if(S.flyout){S.flyout=null; renderAll(); return;} if(S.info){S.info=false; renderAll(); return;} if(S.editDim){S.editDim=false; renderView(); return;} if(S.scene==='export'){ go('loch'); return; } }
  if(e.target.id==='dimedit' && e.key==='Enter'){ const v=parseExpr(e.target.value); S.editDim=false; renderView(); toast(isNaN(v)?T('Das verstehe ich nicht. Beispiele: 5, 2,5 cm, 10/2','I do not understand that. Examples: 5, 2.5 cm, 10/2'):T(`Loch sitzt jetzt ${fmt(v)} mm vom Rand.`,`Hole is now ${fmt(v)} mm from the edge.`)); return; }
  if(e.key==='Enter' && e.target.matches('[role="button"]')){ e.target.click(); return; }
  if(inField) return;
  if(e.key==='ArrowRight'){ stepScene(1); } else if(e.key==='ArrowLeft'){ stepScene(-1); }
  else if(e.key==='Home' && WORK(S.scene)){ animateCam(VIEWS.home); }
  else if(e.key.toLowerCase()==='f' && WORK(S.scene) && !e.metaKey && !e.ctrlKey){ ACT.focus(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='accpick'){ S.accent=e.target.value.toUpperCase(); renderAll(); return; }
  if(e.target.id==='cmdq'){ S.search.q=e.target.value; S.search.sel=0; refreshSearch(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='scsel'){ go(el.value); return; }
  if(el.matches('.fin input') && el.dataset.unit!==undefined && el.dataset.unit!==''){
    const v=parseExpr(el.value), fld=el.closest('.fld');
    if(isNaN(v)){ fld?.classList.add('err'); toast(T('Das verstehe ich nicht. Beispiele: 25+3, 2,5 cm, 1 in, Breite/2','I do not understand that. Examples: 25+3, 2.5 cm, 1 in, Width/2')); return; }
    fld?.classList.remove('err'); const shown=fmt(Math.round(v*100)/100);
    if(el.value.trim()!==shown) toast(`${el.value.trim()} = ${shown} ${el.dataset.unit||''}`);
    el.value=shown;
    if(el.dataset.bind){ S.edits[el.dataset.bind]=Math.max(0.1,v); renderView(); }
  }
});
let tipTimer; const tipEl=$('#tipcard');
function showTip(el){ clearTimeout(tipTimer); tipTimer=setTimeout(()=>{ const r=el.getBoundingClientRect();
  tipEl.innerHTML=`<b>${el.dataset.tipT||''}</b>${el.dataset.tip}`; tipEl.hidden=false;
  const right=r.right+10+262<innerWidth;
  tipEl.style.left=(el.closest('.palette')&&right?r.right+10:clamp(r.left,8,innerWidth-262))+'px';
  tipEl.style.top=(el.closest('.palette')?r.top:(r.bottom+8+tipEl.offsetHeight>innerHeight?r.top-tipEl.offsetHeight-8:r.bottom+8))+'px'; },700); }
function hideTip(){ clearTimeout(tipTimer); tipEl.hidden=true; }
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'); if(t) showTip(t); else hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]'); if(t) showTip(t); else hideTip();});
document.addEventListener('mouseleave',hideTip);

function renderAll(){
  const fid=document.activeElement?.id;
  const R=document.documentElement; R.dataset.theme=effTheme(); R.lang=S.lang; applyAccent();
  renderDemo(); renderMenu();
  const app=$('#app'), start=S.scene==='start';
  app.className=[S.scene==='karte'?'kit':'', S.focus&&WORK(S.scene)?'focus':'', start?'is-start':''].join(' ').trim();
  $('#start').hidden=!start;
  if(start) renderStart();
  else { renderTabs(); renderLeft(); renderRight(); renderStatus(); renderView(); }
  renderExport(); renderSearch(); renderInfo();
  if(fid){ const el=document.getElementById(fid); if(el && el!==document.activeElement) el.focus(); }
}
addEventListener('resize',()=>{ renderView(); positionFlyout(); });
(function boot(){
  const h=(location.hash||'').slice(1);
  if(h==='einstellungen'){ S.startPage='settings'; go('start'); return; }
  go(SCENES.some(s=>s.id===h)?h:'start');
})();
</script>
