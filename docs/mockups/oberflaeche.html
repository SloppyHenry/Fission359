<!-- Fission3D – klickbares Oberflächen-Mockup (Attrappe, kein Produktionscode). Gestaltung nach Vorlage „Formwerk 3D“ des Product Owners. -->
<title>Fission3D Oberfläche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen desktop app. Amber mockup strip on top (not part of the app), then menu bar / document tabs /
   [bodies + recipe | 3D view with floating tools | properties] / status line. Dark-first, IBM Plex, one blue accent. */
:root{
  color-scheme: dark;
  --chrome:#131416; --bar:#1A1B1E; --panel:#1F2023; --field:#27292D; --field-2:#2E3035; --raise:#26282C;
  --line:#34363B; --line-2:#3A3D43; --line-3:#4A4E55;
  --view:#2B2D31; --view-2:#232528;
  --fg:#E8E9EB; --fg-2:#C9CCD1; --fg-3:#A4A8B0; --fg-4:#979CA5;
  --accent:#2563D9; --accent-fg:#FFFFFF; --accent-text:#7FB0FF; --accent-line:#5B97FF; --accent-soft:#22314F; --accent-hover:#2F6FE6;
  --amber:#F0A53A; --amber-fg:#1A1205; --amber-soft:rgba(240,165,58,.12); --amber-line:rgba(240,165,58,.45);
  --ok:#5DBB63; --ok-soft:rgba(93,187,99,.14); --bad:#F47C74; --bad-soft:rgba(242,100,92,.14);
  --ax-x:#E5534B; --ax-y:#57AB5A; --ax-z:#5B97FF;
  --bed:#25272B; --bed-rgb:37,39,43; --bed-edge:#44474E; --grid:#303237; --grid-2:#3A3D43;
  --edge:rgba(10,11,13,.55); --shd:rgba(0,0,0,.6);
  --handle:#FFFFFF; --handle-line:#16181b;
  --glass:rgba(31,32,35,.94); --shadow-ui:rgba(0,0,0,.45);
  --ghost:rgba(170,182,200,.26); --ghost-line:rgba(215,222,234,.8);
  --demo-bg:#2c2516; --demo-bg2:#3a311c; --demo-fg:#f4e5c2; --demo-line:#7c6534; --demo-on:#fff8e8; --note:#e6bf6e;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Cantarell,"Noto Sans",Ubuntu,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  --font-round:"Arial Rounded MT Bold","Nunito","Varela Round",-apple-system,"Segoe UI",sans-serif;
  --dur:180ms;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme: light;
  --chrome:#E9EBEE; --bar:#F0F1F3; --panel:#F7F8F9; --field:#FFFFFF; --field-2:#F0F2F5; --raise:#FFFFFF;
  --line:#D9DCE1; --line-2:#CDD1D7; --line-3:#B5BBC4; --view:#E3E6EA; --view-2:#D4D8DE;
  --fg:#1B1D21; --fg-2:#3A3E45; --fg-3:#50555E; --fg-4:#5E646E;
  --accent:#2563D9; --accent-fg:#FFFFFF; --accent-text:#1F57C2; --accent-line:#2563D9; --accent-soft:#DCE8FF; --accent-hover:#1E57C4;
  --amber:#8F5600; --amber-fg:#FFFFFF; --amber-soft:rgba(183,110,0,.1); --amber-line:rgba(183,110,0,.45);
  --ok:#17692F; --ok-soft:rgba(30,125,58,.1); --bad:#B71F1F; --bad-soft:rgba(198,40,40,.08);
  --bed:#CDD2D9; --bed-rgb:205,210,217; --bed-edge:#A7AEB8; --grid:#BCC2CB; --grid-2:#AAB1BC;
  --edge:rgba(20,24,30,.45); --shd:rgba(30,40,60,.32); --handle-line:#1c1f24;
  --glass:rgba(250,251,252,.96); --shadow-ui:rgba(30,40,60,.18);
  --ghost:rgba(90,110,140,.22); --ghost-line:rgba(40,60,90,.75);
  --demo-bg:#fbf0d4; --demo-bg2:#fff8e6; --demo-fg:#4a3810; --demo-line:#c9a253; --demo-on:#2a1d03; --note:#80520a;
}}
:root[data-theme="light"]{
  color-scheme: light;
  --chrome:#E9EBEE; --bar:#F0F1F3; --panel:#F7F8F9; --field:#FFFFFF; --field-2:#F0F2F5; --raise:#FFFFFF;
  --line:#D9DCE1; --line-2:#CDD1D7; --line-3:#B5BBC4; --view:#E3E6EA; --view-2:#D4D8DE;
  --fg:#1B1D21; --fg-2:#3A3E45; --fg-3:#50555E; --fg-4:#5E646E;
  --accent:#2563D9; --accent-fg:#FFFFFF; --accent-text:#1F57C2; --accent-line:#2563D9; --accent-soft:#DCE8FF; --accent-hover:#1E57C4;
  --amber:#8F5600; --amber-fg:#FFFFFF; --amber-soft:rgba(183,110,0,.1); --amber-line:rgba(183,110,0,.45);
  --ok:#17692F; --ok-soft:rgba(30,125,58,.1); --bad:#B71F1F; --bad-soft:rgba(198,40,40,.08);
  --bed:#CDD2D9; --bed-rgb:205,210,217; --bed-edge:#A7AEB8; --grid:#BCC2CB; --grid-2:#AAB1BC;
  --edge:rgba(20,24,30,.45); --shd:rgba(30,40,60,.32); --handle-line:#1c1f24;
  --glass:rgba(250,251,252,.96); --shadow-ui:rgba(30,40,60,.18);
  --ghost:rgba(90,110,140,.22); --ghost-line:rgba(40,60,90,.75);
  --demo-bg:#fbf0d4; --demo-bg2:#fff8e6; --demo-fg:#4a3810; --demo-line:#c9a253; --demo-on:#2a1d03; --note:#80520a;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--chrome);color:var(--fg);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;border-radius:4px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd,.kbd{font:500 12px/1 var(--mono);padding:3px 6px;border-radius:4px;background:var(--field);border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--note);border:1px dashed var(--note);border-radius:4px;padding:0 5px;line-height:18px;white-space:nowrap;cursor:help}
.btn{height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--line-2);background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;color:var(--fg);font-weight:500;transition:background var(--dur),border-color var(--dur)}
.btn:hover{background:var(--field);border-color:var(--line-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-fg);font-weight:600}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:0;background:none;color:var(--fg-3)}
.iconbtn:hover{background:var(--field);color:var(--fg)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-text);font-size:12px;display:inline-flex;align-items:center;gap:4px}

/* ---------- mockup strip (not part of the app) ---------- */
#demo{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 12px;background:var(--demo-bg);color:var(--demo-fg);border-bottom:1px dashed var(--demo-line);font-size:12px;position:relative;z-index:40}
#demo .tag{font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--demo-line);border-radius:4px}
#demo .grp-d{display:flex;align-items:center;gap:6px}
#demo .lbl{opacity:.85}
.seg{display:inline-flex;border:1px solid var(--demo-line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 9px;color:inherit;font-size:12px}
.seg button+button{border-left:1px solid var(--demo-line)}
.seg button[aria-pressed="true"]{background:var(--demo-line);color:var(--demo-on);font-weight:600}
#demo select{background:var(--demo-bg2);color:var(--demo-fg);border:1px solid var(--demo-line);border-radius:6px;padding:3px 6px;max-width:250px;font-size:12px}
.dbtn{background:var(--demo-bg2);border:1px solid var(--demo-line);border-radius:6px;padding:3px 9px;color:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px}

/* ---------- app grid ---------- */
#app{flex:1;min-height:0;position:relative;display:grid;--lw:248px;--rw:300px;
  grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);
  grid-template-rows:40px 52px minmax(0,1fr) 28px;
  grid-template-areas:"menu menu menu" "tabs tabs tabs" "left view right" "status status status"}
#app.focus{--lw:0px;--rw:0px} #app.focus #left,#app.focus #right{display:none}
#app.kit{--lw:312px;--rw:0px} #app.kit #right{display:none}
#menu{grid-area:menu} #tabs{grid-area:tabs} #left{grid-area:left} #view{grid-area:view} #right{grid-area:right} #status{grid-area:status}

#menu{display:grid;grid-template-columns:auto minmax(200px,440px) auto;justify-content:space-between;align-items:center;gap:12px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line);z-index:6}
.menu-l{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;margin-right:10px}
.brand svg{width:18px;height:18px}
.mbtn{background:none;border:0;padding:5px 9px;border-radius:5px;color:var(--fg-2);white-space:nowrap}
.mbtn:hover{background:var(--field);color:var(--fg)}
.search{display:flex;align-items:center;gap:10px;height:28px;padding:0 6px 0 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--bar);color:var(--fg-4);width:100%;text-align:left}
.search span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search:hover{border-color:var(--line-3);color:var(--fg-3)}
.menu-r{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--fg-4);font-size:12px;min-width:0;white-space:nowrap}

#tabs{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
.dtab{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:7px;border:1px solid transparent;background:none;color:var(--fg-3);white-space:nowrap;min-width:0}
.dtab:hover{background:var(--panel);color:var(--fg)}
.dtab.on{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:500}
.dtab .x{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;color:var(--fg-4)}
.dtab .x .ic{width:12px;height:12px}
.spacer{flex:1}
.mode{display:flex;align-items:center;gap:8px;color:var(--fg-4);font-size:12px}
.segc{display:inline-flex;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.segc button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--fg-3);white-space:nowrap}
.segc button:hover{color:var(--fg)}
.segc button[aria-pressed="true"]{background:var(--field-2);color:var(--fg);font-weight:600}
.segc .ic{width:14px;height:14px}

/* ---------- side panels ---------- */
aside.panel{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#left{border-right:1px solid var(--line)} #right{border-left:1px solid var(--line)}
.ptabs{display:flex;align-items:center;gap:2px;height:46px;padding:0 10px 0 6px;border-bottom:1px solid var(--line);flex:none}
.ptabs button{height:46px;padding:0 10px;border:0;background:none;color:var(--fg-3);font-weight:500;border-bottom:2px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
.ptabs .iconbtn{margin-left:auto;width:26px;height:26px}
.pbody{overflow:auto;padding:10px;flex:1;min-height:0}
.pfind{display:flex;align-items:center;gap:8px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--field);padding:0 10px;color:var(--fg-4);margin-bottom:10px}
.pfind input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg)}
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.trow{display:grid;grid-template-columns:16px 18px minmax(0,1fr) auto 24px;align-items:center;gap:6px;height:33px;padding:0 4px 0 6px;border-radius:6px;color:var(--fg-2);border:1px solid transparent;width:100%;text-align:left;background:none}
.trow:hover{background:var(--field)}
.trow.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent-line) 45%,transparent);color:var(--fg);font-weight:600}
.trow.group{font-weight:600;color:var(--fg)}
.trow.child{padding-left:24px}
.trow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .cnt{font-size:12px;color:var(--fg-4);font-weight:400}
.trow .eye{width:24px;height:24px;display:grid;place-items:center;border:0;background:none;border-radius:4px;color:var(--fg-4)}
.trow .eye:hover{color:var(--fg)}
.trow.off .nm{color:var(--fg-4);text-decoration:line-through}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--edge);display:inline-block}
.sw.holes{background:repeating-linear-gradient(45deg,var(--fg-3) 0 2px,transparent 2px 4px)}

.rec{border-top:1px solid var(--line);flex:none;max-height:46%;display:flex;flex-direction:column;min-height:0}
.rec-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-weight:600}
.rec-list{list-style:none;margin:0;padding:0 8px;overflow:auto;min-height:0}
.ri{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start;width:100%;text-align:left;padding:6px 8px;border-radius:6px;border:1px solid transparent;background:none;color:var(--fg-2)}
.ri:hover{background:var(--field);color:var(--fg)}
.ri .num{font:500 12px/18px var(--mono);color:var(--fg-4)}
.ri .rt{line-height:18px}
.ri .rt small{display:block;color:var(--fg-4);font-size:12px}
.ri .rt small.stw.bad{color:var(--bad);font-weight:600} .ri .rt small.stw.edit{color:var(--accent-text)}
.ri.edit{background:var(--accent-soft);color:var(--fg)}
.ri.bad{background:var(--bad-soft);color:var(--fg)}
.st{font-size:12px;line-height:18px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.st .ic{width:13px;height:13px;stroke-width:2.4}
.st.ok{color:var(--ok)} .st.edit{color:var(--accent-text)} .st.bad{color:var(--bad)}
.now{display:flex;align-items:center;gap:8px;color:var(--accent-text);font-size:12px;font-weight:600;margin:4px 8px;cursor:ns-resize;user-select:none}
.now::before,.now::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--accent-line)}
.rec-foot{padding:6px 14px 12px;color:var(--fg-4);font-size:12px}
.empty{color:var(--fg-4);font-size:12px;padding:6px 8px;line-height:1.5}

/* right panel */
.ohead{display:grid;grid-template-columns:36px minmax(0,1fr) 28px;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.ohead .oi{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.ohead b{display:block;font-size:14.5px;font-weight:600}
.ohead small{display:block;color:var(--fg-4);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{padding:14px;border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h3{margin:0;font-size:13px;font-weight:600}
.sec-h .aside{color:var(--fg-4);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:3px 9px;font-size:12px;background:var(--field);color:var(--fg-3)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent-line) 40%,transparent);color:var(--accent-text)}
.pill .ic{width:13px;height:13px}
.badge{font-size:12px;font-weight:600;border-radius:10px;padding:0 8px;line-height:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge.ok{color:var(--ok);background:var(--ok-soft)} .badge.bad{color:var(--bad);background:var(--bad-soft)} .badge.edit{color:var(--accent-text);background:var(--accent-soft)} .badge.amber{color:var(--amber);background:var(--amber-soft)}
.badge .ic{width:13px;height:13px;stroke-width:2.4}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{color:var(--fg-4);font-size:12px;cursor:ew-resize;user-select:none}
.fin{display:flex;align-items:center;gap:6px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--field);padding:0 8px;min-width:0;transition:border-color var(--dur),box-shadow var(--dur)}
.fin:focus-within,.fld.active .fin{border-color:var(--accent-line);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-line) 22%,transparent)}
.fin input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font:500 13px var(--mono);color:var(--fg);padding:0}
.fin .unit{color:var(--fg-4);font:12px var(--mono)}
.fin .ax{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font:600 11.5px var(--mono);color:#fff;flex:none}
.fld.err .fin{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.fnote{font-size:12px;color:var(--fg-4)}
.fld.err .fnote{color:var(--bad)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;margin:9px 0}
.row>span:first-child{color:var(--fg-4);font-size:12.5px}
.selbox{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 9px;width:100%;text-align:left;color:var(--fg)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:8px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px var(--edge)}
.swatches button[aria-pressed="true"]{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--panel) inset}
.swatches .add{background:none;border:1px dashed var(--line-3);color:var(--fg-4);display:grid;place-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--fg)}
.switch .tr{width:32px;height:18px;border-radius:9px;background:var(--line-2);position:relative;transition:background var(--dur)}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform var(--dur)}
.switch[aria-checked="true"] .tr{background:var(--accent)}
.switch[aria-checked="true"] .tr::after{transform:translateX(14px);background:#fff}
.disclose{border:1px dashed var(--line-3);border-radius:8px;padding:12px 14px;color:var(--fg-3);font-size:12.5px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:9px}
.chk .ic{color:var(--ok);stroke-width:2.3;margin-top:1px}
.chk small{display:block;color:var(--fg-4);font-size:12px}
.slider{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;color:var(--fg-4);font-size:12.5px}
.slider .track{height:4px;border-radius:2px;background:var(--line-2);position:relative}
.slider .track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent-line)}
.slider .track b{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--accent-line);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--panel)}

/* ---------- 3D view ---------- */
#view{position:relative;overflow:hidden;background:radial-gradient(ellipse 85% 75% at 50% 45%,var(--view),var(--view-2));min-width:0;min-height:0}
#view svg.scene{position:absolute;inset:0;display:block}
#ov{position:absolute;inset:0;pointer-events:none}
#ov .ov{position:absolute;pointer-events:auto}
.float{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px var(--shadow-ui)}
.vbar{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:4}
.vbar .float{display:flex;align-items:center;padding:3px;gap:2px}
.vbar .float>button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:6px;padding:5px 10px;color:var(--fg-3);font-size:12.5px;white-space:nowrap}
.vbar .float>button:hover{color:var(--fg)}
.vbar .float>button[aria-pressed="true"]{background:var(--field-2);color:var(--fg);font-weight:600}
.vbar .float .ic{width:14px;height:14px}
.palette{position:absolute;left:12px;top:60px;width:76px;display:flex;flex-direction:column;gap:2px;padding:6px;z-index:4;max-height:calc(100% - 72px);overflow:auto}
.palette .pt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:7px;border:0;background:none;color:var(--fg-2);font-size:12px;line-height:1.1}
.palette .pt:hover{background:var(--field)}
.palette .pt[aria-pressed="true"]{background:var(--accent);color:#fff}
.palette .pt[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-text)}
.palette .pt .ic{width:18px;height:18px}
.palette hr{width:70%;border:0;border-top:1px solid var(--line);margin:5px auto}
#cube{position:absolute;top:8px;right:12px;width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
#cube svg{display:block}
.vc-face{fill:var(--field);stroke:var(--line-3);stroke-width:1;cursor:pointer;transition:fill var(--dur)}
.vc-face:hover{fill:var(--accent-soft);stroke:var(--accent-line)}
.vc-t{fill:var(--fg-3);font-weight:600;pointer-events:none;font-family:var(--mono)}
.cube-btns{display:flex;gap:6px}
.cube-btns .iconbtn{width:30px;height:30px;background:var(--panel);border:1px solid var(--line)}
.navbtns{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:2px;padding:4px;z-index:4}
.navbtns .iconbtn{width:34px;height:34px}
.lotse{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(600px,calc(100% - 200px));display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;z-index:5;border-color:var(--line-2)}
.lotse .li{width:32px;height:32px;border-radius:8px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;align-self:start}
.lotse .lk{font-size:12px;color:var(--fg-4)}
.lotse .lk b{color:var(--amber);font-weight:600;margin-right:6px}
.lotse .dots{display:flex;gap:4px;margin:4px 0 6px}
.lotse .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-3)}
.lotse .dots i.on{background:var(--amber)}
.lotse h4{margin:0 0 3px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.lotse p{margin:0;color:var(--fg-2);font-size:13px}
.lotse .la{display:flex;gap:8px;align-items:center}
.lotse .keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.lotse .keys kbd{opacity:.45;transition:opacity var(--dur)}
.lotse .keys kbd.on{opacity:1} .lotse .keys kbd.cur{background:var(--accent);color:#fff;border-color:var(--accent);opacity:1}
.lotse .good{color:var(--ok);font-weight:600;font-size:12.5px;margin-top:6px;display:flex;align-items:center;gap:6px}
.lotse-pill{position:absolute;left:100px;bottom:14px;z-index:5;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;color:var(--amber);font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:8px}

.bed-top{fill:var(--bed)} .grid{stroke:var(--grid);stroke-width:1} .grid.major{stroke:var(--grid-2)}
.bed-rim{fill:none;stroke:var(--bed-edge);stroke-width:1.5}
.ax-x{stroke:var(--ax-x);stroke-width:1.5;opacity:.8} .ax-y{stroke:var(--ax-y);stroke-width:1.5;opacity:.8}
.origin{fill:var(--fg-3)}
.bedlabel{fill:var(--fg-4);font-size:12px;font-family:var(--mono)}
.shd{fill:var(--shd)}
.hdl{fill:var(--handle);stroke:var(--handle-line);stroke-width:1.3;cursor:pointer;transition:fill var(--dur)}
.hdl:hover{fill:var(--accent-line)}
.hdl.lift{fill:var(--handle-line);stroke:var(--handle)}
.cursor{fill:#ffffff;stroke:#000000;stroke-width:1.1;stroke-linejoin:round}
.dim{stroke:var(--fg-3);stroke-width:1.2;fill:none} .dim-ext{stroke:var(--fg-4);stroke-width:1;stroke-dasharray:3 3;fill:none}
.dimb{stroke:var(--accent-line);stroke-width:1.3;fill:none;opacity:.9}
.selo{fill:none;stroke:var(--accent-line);stroke-width:2.2;stroke-linejoin:round}
.accl{stroke:var(--accent-line);fill:none;stroke-width:2.2;stroke-linecap:round}
.accsoft{fill:color-mix(in srgb,var(--accent-line) 22%,transparent);stroke:var(--accent-line);stroke-width:1.5}
.gx{stroke:var(--ax-x)} .gy{stroke:var(--ax-y)} .gz{stroke:var(--ax-z)}
.gxf{fill:var(--ax-x)} .gyf{fill:var(--ax-y)} .gzf{fill:var(--ax-z)}
.glab{font:600 13px var(--mono)}
.ghost{fill:url(#stripes);stroke:var(--ghost-line);stroke-width:1.3;stroke-dasharray:5 4}
.ghost-top{fill:none;stroke:var(--ghost-line);stroke-width:1.3;stroke-dasharray:5 4}
.gs-a{fill:var(--ghost)} .gs-b{stroke:var(--ghost-line);stroke-width:2.2;opacity:.7}
.ghost-red{fill:var(--bad-soft);stroke:var(--bad);stroke-dasharray:5 4;stroke-width:1.6}
.badl{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.pick{cursor:pointer}
.pick:hover{stroke:var(--accent-line)!important;stroke-width:2!important}
.emb{font-family:var(--font-round);font-weight:800}
.ptr{stroke:var(--fg-4);stroke-width:1.2;fill:none;stroke-dasharray:2 3}

.dpill{transform-origin:0 0;display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;background:var(--panel);border:1.5px solid var(--accent-line);color:var(--fg);font:500 13px var(--mono);white-space:nowrap;box-shadow:0 3px 10px var(--shadow-ui)}
.dpill.active{background:var(--accent);color:#fff}
.dpill.active b::after{content:"";display:inline-block;width:2px;height:14px;background:#fff;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.dpill b{font-weight:500}
@keyframes blink{50%{opacity:0}}
.bubble{transform:translate(16px,14px);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:4px 9px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px var(--shadow-ui);color:var(--fg-3)}
.bubble b{font:600 14px var(--mono);color:var(--fg)}
.bubble .typed{color:var(--accent-text)}
.chip{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:3px 10px;font-size:12px;white-space:nowrap;color:var(--fg);box-shadow:0 4px 12px var(--shadow-ui)}
.chip b{font-family:var(--mono);font-weight:600}
button.chip,.chip[role="button"]{cursor:pointer}
.chip:hover{border-color:var(--accent-line)}
.chip.ok .ic{color:var(--ok);stroke-width:2.4}
.chip.acc{border-color:var(--accent-line);color:var(--accent-text)}
.chip input{width:46px;background:var(--field);border:1px solid var(--accent-line);border-radius:5px;padding:0 4px;text-align:right;font-family:var(--mono)}
.dimf{transform:translate(-50%,-50%);display:inline-flex;align-items:baseline;gap:6px;background:var(--field);border:1px solid var(--line-2);border-radius:7px;padding:4px 9px;font-size:12px;white-space:nowrap;color:var(--fg-4);box-shadow:0 4px 12px var(--shadow-ui)}
.dimf b{font:600 15px var(--mono);color:var(--fg);min-width:22px;text-align:right}
.dimf.active{border-color:var(--accent-line);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-line) 25%,transparent)}
.dimf.active b::after{content:"";display:inline-block;width:2px;height:15px;background:var(--accent-line);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.ctx{transform:translate(-50%,-100%);display:flex;gap:2px;padding:4px;white-space:nowrap}
.ctx.below{transform:translate(-50%,0)}
.ctx button{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:6px;padding:5px 9px;color:var(--fg-2);font-size:12.5px}
.ctx button:hover{background:var(--field);color:var(--fg)}
.ctx button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.ctx .k{color:var(--fg-4);font-size:12px}
.msg{width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;box-shadow:0 14px 36px var(--shadow-ui);position:relative;overflow:hidden}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.msg h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.msg h4 .ic{color:var(--bad);stroke-width:2.1}
.msg p{margin:0 0 12px;color:var(--fg-2)}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px}
.msg .where{font-size:12px;color:var(--fg-4);margin-top:10px}
.banner{position:absolute;top:60px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;font-weight:600;white-space:nowrap;z-index:4}
.banner .ic{color:var(--ok);stroke-width:2.4}
.inset{position:absolute;left:100px;bottom:14px;width:300px;padding:12px 14px;font-size:12px;color:var(--fg-3);z-index:4}
.inset h5{margin:0 0 6px;font-size:12.5px;color:var(--fg);display:flex;justify-content:space-between;gap:6px}
.inset svg{display:block;width:100%;height:70px;margin:4px 0}

.fly{position:absolute;top:60px;left:98px;width:min(460px,calc(100% - 230px));padding:14px;z-index:6}
.fly-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.fly-h h4{margin:0;font-size:14px}
.fly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:12px;color:var(--fg-2);transition:border-color var(--dur)}
.tile:hover{border-color:var(--accent-line);color:var(--fg)}
.tile.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--fg)}
.tile svg.shape{width:62px;height:52px}
.fly-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fly-list button{text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 10px;color:var(--fg)}
.fly-list button:hover{border-color:var(--accent-line)}
.fly-list small{display:block;color:var(--fg-4);font-size:12px}
.fly-kits{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-4);flex-wrap:wrap}

.cmd{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));overflow:hidden;z-index:8}
.cmd-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.cmd-res{list-style:none;margin:0;padding:6px;max-height:300px;overflow:auto}
.cmd-res li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer}
.cmd-res li[aria-selected="true"]{background:var(--accent-soft)}
.cmd-res .ci{width:30px;height:30px;border-radius:7px;background:var(--field);display:grid;place-items:center;color:var(--fg-2)}
.cmd-res .cn{font-weight:600}
.cmd-res .cg{color:var(--fg-4);font-weight:400}
.cmd-res .why{display:block;font-size:12px;color:var(--fg-4)}
.cmd-res mark{background:none;color:var(--accent-text);font-weight:650}
.cmd-try{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 14px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-4)}
.cmd-try button{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:1px 9px;font-size:12px}

#status{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--chrome);border-top:1px solid var(--line);color:var(--fg-3);font-size:12px;min-width:0;white-space:nowrap}
#status .sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;gap:16px}
#status .sl b{color:var(--fg);font-weight:600}
#status .sr2{display:flex;gap:14px;align-items:center}
#status .dotok{display:inline-flex;align-items:center;gap:6px}
#status .dotok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- kit (left panel stepper) ---------- */
.kit-h{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.kit-h h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.kit-h .kb{display:flex;gap:6px}
.kstep{border-bottom:1px solid var(--line)}
.kstep>button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:none;border:0;text-align:left;color:var(--fg-2);font-weight:500}
.kstep>button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--field-2);font:600 12px var(--mono);color:var(--fg-2)}
.kstep.done>button .n{background:var(--ok-soft);color:var(--ok)}
.kstep.cur>button{color:var(--fg);font-weight:600}
.kstep.cur>button .n{background:var(--accent);color:#fff}
.kstep .kbody{padding:2px 14px 14px}
.ksec{margin:4px 0 14px}
.ksec h4{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--fg-4)}
.kopts{display:flex;flex-wrap:wrap;gap:6px}
.kopt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--fg-2)}
.kopt:hover{border-color:var(--line-3)}
.kopt.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--fg);font-weight:600}
.kopt.tall{flex-direction:column;width:62px;padding:6px 4px;gap:3px}
.kopt.tall svg{width:26px;height:26px}
.kopt .ic{width:15px;height:15px}
.knote{font-size:12px;color:var(--fg-4);margin:6px 2px 0}
.kfoot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex:none}

/* ---------- start screen ---------- */
#start{position:absolute;top:40px;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--chrome)}
.snav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 12px;min-height:0;overflow:auto}
.snav>button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;border:0;background:none;color:var(--fg-2);font-weight:500;text-align:left}
.snav>button:hover{background:var(--field)}
.snav>button.on{background:var(--field-2);color:var(--fg);font-weight:600}
.snav .cnt{margin-left:auto;font:600 12px var(--mono);color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 6px}
.stip{margin-top:auto;border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--fg-2)}
.stip b{display:flex;align-items:center;gap:7px;color:var(--amber);margin-bottom:6px}
.smain{overflow:auto;padding:30px 44px 40px;min-width:0}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.shead small{color:var(--fg-4);font-size:13px}
.shead h1{margin:2px 0 0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.shead .sb{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.srow1{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px}
.cont{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px;padding:16px}
.cont .art{background:radial-gradient(ellipse at 50% 40%,var(--view),var(--view-2));border-radius:9px;display:grid;place-items:center;min-height:190px}
.cont .art svg{width:240px;height:180px}
.cont small{color:var(--fg-4);font-size:12.5px}
.cont h2{margin:6px 0 2px;font-size:19px}
.prog{background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:16px 0}
.prog .ph{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.prog .ph b{color:var(--amber)}
.prog p{margin:4px 0 10px;font-size:12.5px;color:var(--fg-2)}
.bar{height:4px;border-radius:2px;background:var(--line-2)} .bar i{display:block;height:100%;border-radius:2px;background:var(--amber)}
.bar.blue i{background:var(--accent-line)}
.recent{padding:16px}
.recent .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.rfile{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:6px;border-radius:8px;border:0;background:none;text-align:left;color:var(--fg)}
.rfile:hover{background:var(--field)}
.rfile svg{width:52px;height:40px;background:var(--view-2);border-radius:6px}
.rfile b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfile small{color:var(--fg-4);font-size:12px}
.stitle{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.stitle h2{margin:0;font-size:16px}
.stitle span{color:var(--fg-4);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.btile{display:grid;grid-template-rows:100px auto;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0;overflow:hidden;color:var(--fg);transition:border-color var(--dur)}
.btile:hover{border-color:var(--accent-line)}
.btile .art{background:radial-gradient(ellipse at 50% 40%,var(--view),var(--view-2));display:grid;place-items:center}
.btile .art svg{width:120px;height:96px}
.btile .lab{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px}
.btile .lab b{font-size:13.5px}
.btile .lab span{font-size:12px;color:var(--fg-3)}
.unitchip{align-self:flex-start;margin-top:6px;font-size:12px;color:var(--fg-3);background:var(--field-2);border-radius:10px;padding:1px 8px}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--fg)}
.mcard.cur{border-color:var(--amber-line)}
.mcard .mh{display:flex;align-items:center;gap:10px;font-weight:600}
.mcard .mh i{width:30px;height:30px;border-radius:7px;background:var(--field-2);display:grid;place-items:center;color:var(--fg-2)}
.mcard.cur .mh i{background:var(--amber-soft);color:var(--amber)}
.mcard p{margin:0;font-size:12.5px;color:var(--fg-3)}
.mcard small{color:var(--fg-4);font-size:12px}

/* ---------- export assistant (sheet) ---------- */
#exp{position:absolute;top:40px;left:0;right:0;bottom:0;z-index:15;background:rgba(8,9,10,.62);display:flex;align-items:flex-start;justify-content:center;padding:28px 24px;overflow:auto}
.dlg{width:min(1100px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}
.dlg-h{display:grid;grid-template-columns:40px minmax(0,1fr) 32px;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dlg-h .oi{width:40px;height:40px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.dlg-h b{display:block;font-size:17px}
.dlg-h small{color:var(--fg-4)}
.dlg-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.95fr);gap:22px;padding:20px}
.dlg-b h3{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.dlg-b h3 .hint{color:var(--amber);font-weight:600;display:inline-flex;align-items:center;gap:6px}

const NAMED = {breite:50,tiefe:20,'höhe':4,hoehe:4,width:50,depth:20,height:4};
function parseExpr(src){
  const s=src.replace(/\s+/g,''); let i=0;
  const num=()=>{const m=/^\d+(?:[.,]\d+)?|^[.,]\d+/.exec(s.slice(i)); if(!m) return null; i+=m[0].length; return parseFloat(m[0].replace(',','.'));};
  const unit=v=>{const m=/^(mm|cm|in|zoll|")/i.exec(s.slice(i)); if(!m) return v; i+=m[0].length; const u=m[0].toLowerCase(); return v*(u==='cm'?10:u==='mm'?1:25.4);};
  const atom=()=>{
    if(s[i]==='('){i++; const v=expr(); if(s[i]!==')') throw 0; i++; return unit(v);}
    if(s[i]==='-'){i++; return -atom();}
    const v=num(); if(v!==null) return unit(v);
    const m=/^[a-zäöüß_]+/i.exec(s.slice(i));
    if(m && (m[0].toLowerCase() in NAMED)){ i+=m[0].length; return unit(NAMED[m[0].toLowerCase()]); }
    throw 0;
  };
  const term=()=>{let v=atom(); while(s[i]==='*'||s[i]==='/'){const o=s[i++]; const r=atom(); v=o==='*'?v*r:v/r;} return v;};
  const expr=()=>{let v=term(); while(s[i]==='+'||s[i]==='-'){const o=s[i++]; const r=term(); v=o==='+'?v+r:v-r;} return v;};
  try{ const v=expr(); return i===s.length && isFinite(v) ? v : NaN; }catch(e){ return NaN; }
}

/* ======================= tiny 3D mock renderer ======================= */
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=v=>{const l=Math.hypot(...v)||1; return v.map(x=>x/l);};
const LIGHT=norm([0.35,-0.55,0.76]);
function cam(o){
  const a=o.a*D2R, e=o.e*D2R, ca=Math.cos(a), sa=Math.sin(a), ce=Math.cos(e), se=Math.sin(e);
  const tx=o.tx||0, ty=o.ty||0, tz=o.tz||0;
  return {
    o, s:o.s,
    p:(x,y,z)=>{x-=tx;y-=ty;z-=tz; const u=x*ca-y*sa, w=x*sa+y*ca, up=z*ce+w*se; return [o.cx+u*o.s, o.cy-up*o.s];},
    depth:(x,y,z)=>-(x*sa+y*ca)*ce+z*se,
    toCam:[-sa*ce,-ca*ce,se]
  };
}
function rrect(w,d,r,ox=0,oy=0,n=14){
  r=Math.max(0,Math.min(r,w/2-0.01,d/2-0.01));
  const cs=[[w/2-r,-d/2+r,-90],[w/2-r,d/2-r,0],[-w/2+r,d/2-r,90],[-w/2+r,-d/2+r,180]], pts=[];
  for(const [cx,cy,a0] of cs){
    if(r<=0){pts.push([ox+cx,oy+cy]);continue;}
    for(let i=0;i<=n;i++){const a=(a0+90*i/n)*D2R; pts.push([ox+cx+r*Math.cos(a),oy+cy+r*Math.sin(a)]);}
  }
  return pts;
}
const circle=(cx,cy,r,n=48)=>Array.from({length:n},(_,i)=>[cx+r*Math.cos(i/n*2*Math.PI),cy+r*Math.sin(i/n*2*Math.PI)]);
function starPts(cx,cy,R,r,k=5,rot=90){const p=[];for(let i=0;i<2*k;i++){const a=(rot+i*180/k)*D2R, q=i%2?r:R; p.push([cx+q*Math.cos(a),cy+q*Math.sin(a)]);}return p;}
function gearPts(R,r,t=10){const p=[];for(let i=0;i<t;i++){const a=i/t*2*Math.PI, s=2*Math.PI/t;
  [[0,r],[.12,R],[.38,R],[.5,r]].forEach(([f,q])=>p.push([q*Math.cos(a+f*s),q*Math.sin(a+f*s)]));
  p.push([r*Math.cos(a+.75*s),r*Math.sin(a+.75*s)]);}return p;}
function prismFaces(pts,z0,z1,map=(x,y,z)=>[x,y,z],rgb){
  const F=[], n=pts.length;
  for(let i=0;i<n;i++){const a=pts[i], b=pts[(i+1)%n]; F.push({pts:[map(a[0],a[1],z0),map(b[0],b[1],z0),map(b[0],b[1],z1),map(a[0],a[1],z1)],rgb});}
  F.push({pts:pts.map(p=>map(p[0],p[1],z1)),top:true,rgb});
  F.push({pts:pts.slice().reverse().map(p=>map(p[0],p[1],z0)),rgb});
  return F;
}
function sphereFaces(cx,cy,cz,r,rgb,nu=36,nv=18){
  const F=[], P=(u,v)=>[cx+r*Math.cos(v)*Math.cos(u),cy+r*Math.cos(v)*Math.sin(u),cz+r*Math.sin(v)];
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const u0=i/nu*2*Math.PI,u1=(i+1)/nu*2*Math.PI,v0=-Math.PI/2+j/nv*Math.PI,v1=-Math.PI/2+(j+1)/nv*Math.PI;
    F.push({pts:[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],rgb});}
  return F;
}
function coneFaces(cx,cy,r,h,rgb,n=36){
  const b=circle(cx,cy,r,n), F=[];
  for(let i=0;i<n;i++){const a=b[i],c=b[(i+1)%n]; F.push({pts:[[a[0],a[1],0],[c[0],c[1],0],[cx,cy,h]],rgb});}
  return F;
}
function torusFaces(R,r,z,rgb,nu=30,nv=12){
  const F=[], P=(u,v)=>[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),z+r*Math.sin(v)];
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const u0=i/nu*2*Math.PI,u1=(i+1)/nu*2*Math.PI,v0=j/nv*2*Math.PI,v1=(j+1)/nv*2*Math.PI;
    F.push({pts:[P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)],rgb});}
  return F;
}
function latheFaces(prof,rgb,wall=1.2,n=32){
  const F=[], P=(r,z,u)=>[r*Math.cos(u),r*Math.sin(u),z];
  for(let i=0;i<n;i++){const u0=i/n*2*Math.PI,u1=(i+1)/n*2*Math.PI;
    for(let k=0;k<prof.length-1;k++){const [ra,za]=prof[k],[rb,zb]=prof[k+1];
      F.push({pts:[P(ra,za,u0),P(ra,za,u1),P(rb,zb,u1),P(rb,zb,u0)],rgb});
      if(k>0) F.push({pts:[P(ra-wall,za,u1),P(ra-wall,za,u0),P(rb-wall,zb,u0),P(rb-wall,zb,u1)],rgb});}
    const [rt,zt]=prof[prof.length-1];
    F.push({pts:[P(rt,zt,u0),P(rt,zt,u1),P(rt-wall,zt,u1),P(rt-wall,zt,u0)],rgb});}
  return F;
}
function newell(P){let x=0,y=0,z=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
  x+=(a[1]-b[1])*(a[2]+b[2]); y+=(a[2]-b[2])*(a[0]+b[0]); z+=(a[0]-b[0])*(a[1]+b[1]);} return norm([x,y,z]);}
function shade(rgb,n,C,mul=1){const d=Math.max(0,dot(n,LIGHT)), v=Math.max(0,dot(n,C.toCam)), k=(0.5+0.5*d+0.12*v)*mul;
  return `rgb(${rgb.map(c=>Math.min(255,Math.round(c*k))).join(',')})`;}
const ptsAttr=(C,P)=>P.map(p=>{const q=C.p(p[0],p[1],p[2]); return r1(q[0])+','+r1(q[1]);}).join(' ');
const ptsAttr2=Q=>Q.map(q=>r1(q[0])+','+r1(q[1])).join(' ');
/* Painter's algorithm with back-face culling: good enough for a mock of matte printed plastic. */
function drawPoly(C,faces,rgb,opt={}){
  const vis=[];
  for(const f of faces){const n=newell(f.pts); if(dot(n,C.toCam)<=1e-4) continue;
    let d=0; for(const p of f.pts) d+=C.depth(p[0],p[1],p[2]); vis.push({f,n,d:d/f.pts.length});}
  vis.sort((a,b)=>a.d-b.d);
  const mode=opt.icon?'farbe':S.display;
  if(mode==='draht') return vis.map(({f})=>`<polygon points="${ptsAttr(C,f.pts)}" fill="none" style="stroke:var(--accent-line)" stroke-width="${f.top?1.2:0.6}" stroke-opacity="${f.top?0.95:0.45}"/>`).join('');
  return vis.map(({f,n})=>{const fill=shade(mode==='volumen'?[200,203,210]:(f.rgb||rgb),n,C); const edge=opt.edges||f.top;
    return `<polygon points="${ptsAttr(C,f.pts)}" fill="${fill}" stroke="${edge?'var(--edge)':fill}" style="${edge?'stroke:var(--edge)':''}" stroke-width="${edge?1:0.7}" stroke-linejoin="round" ${opt.pick?`class="pick" data-act="${opt.pick}"`:''}/>`;}).join('');
}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of P.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1));}
function drawHole(C,cx,cy,r,zt,zb,rgb){
  const id=uid('hc'), top=circle(cx,cy,r,48).map(p=>[p[0],p[1],zt]), bot=circle(cx,cy,r,48).map(p=>[p[0],p[1],zb]);
  const wall=`rgb(${rgb.map(c=>Math.round(c*.5)).join(',')})`;
  return `<clipPath id="${id}"><polygon points="${ptsAttr(C,top)}"/></clipPath>
    <polygon points="${ptsAttr(C,top)}" fill="${wall}" style="stroke:var(--edge)" stroke-width="1"/>
    <polygon points="${ptsAttr(C,bot)}" class="bed-top" clip-path="url(#${id})"/>`;
}
function affine(C,x,y,z){const p0=C.p(x,y,z),pu=C.p(x+1,y,z),pv=C.p(x,y-1,z);
  return [pu[0]-p0[0],pu[1]-p0[1],pv[0]-p0[0],pv[1]-p0[1],p0[0],p0[1]].map(v=>Math.round(v*1000)/1000).join(' ');}
function embossText(C,lines,x,y,z,h,size,rgb,lh=1.15){
  if(S.display==='volumen') rgb=[200,203,210];
  if(S.display==='draht'){ const L=[].concat(lines), y0=-(L.length-1)*size*lh/2;
    return `<text class="emb" transform="matrix(${affine(C,x,y,z+h)})" font-size="${size}" text-anchor="middle" dominant-baseline="central" fill="none" style="stroke:var(--accent-line)" stroke-width="0.12">${L.map((t,k)=>`<tspan x="0" y="${r1(y0+k*size*lh)}">${t}</tspan>`).join('')}</text>`; }
  const n=Math.max(3,Math.round(h/0.2)), side=`rgb(${rgb.map(c=>Math.round(c*.62)).join(',')})`, top=`rgb(${rgb.join(',')})`;
  const L=[].concat(lines), y0=-(L.length-1)*size*lh/2; let out='';
  for(let i=0;i<=n;i++){const last=i===n;
    out+=`<text class="emb" transform="matrix(${affine(C,x,y,z+h*i/n)})" font-size="${size}" text-anchor="middle" dominant-baseline="central" fill="${last?top:side}" ${last?'style="stroke:var(--edge)" stroke-width="0.07"':''}>${L.map((t,k)=>`<tspan x="0" y="${r1(y0+k*size*lh)}">${t}</tspan>`).join('')}</text>`;}
  return out;
}
function cylGhost(C,cx,cy,r,z0,z1){
  const c=circle(cx,cy,r,48), all=[...c.map(p=>C.p(p[0],p[1],z0)),...c.map(p=>C.p(p[0],p[1],z1))];
  return `<polygon points="${ptsAttr2(hull(all))}" class="ghost"/><polygon points="${ptsAttr(C,c.map(p=>[p[0],p[1],z1]))}" class="ghost-top"/>`;
}
function shadowOf(C,outline,h,sd){
  const off=outline.map(p=>C.p(p[0]-0.28*h-0.6,p[1]+0.42*h+0.8,0)), base=outline.map(p=>C.p(p[0],p[1],0));
  return `<polygon points="${ptsAttr2(off)}" class="shd" opacity=".55" filter="url(#blurL)"/><polygon points="${ptsAttr2(base)}" class="shd" opacity=".7" filter="url(#blurS)"/>`;
}
const SVGDEFS = sd => `<defs>
  <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${r1(sd)}"/></filter>
  <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${r1(Math.max(1,sd/3))}"/></filter>
  <pattern id="stripes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="gs-a"/><line x1="0" y1="0" x2="0" y2="7" class="gs-b"/></pattern>
</defs>`;
const COL={white:[236,232,224],red:[214,66,56],green:[66,156,96],yellow:[242,183,56],blue:[70,136,206],grey:[150,156,166],

function shapeSvg(kind,w=60,h=50,zoom=1){ const keep=S.display; S.display='farbe'; try{ return shapeSvg0(kind,w,h,zoom); } finally { S.display=keep; } }
function shapeSvg0(kind,w=60,h=50,zoom=1){
  const C=cam({a:-30,e:30,s:1.15*zoom*(w/60),cx:w/2,cy:h*0.62,tx:0,ty:0,tz:0});
  let g='';
  switch(kind){
    case 'quader': g=drawPoly(C,prismFaces(rrect(20,20,0),0,18),COL.blue,{edges:true}); break;
    case 'zylinder': g=drawPoly(C,prismFaces(circle(0,0,10,40),0,18),COL.orange); break;
    case 'kugel': g=drawPoly(C,sphereFaces(0,0,10,10.5,COL.purple),COL.purple); break;
    case 'kegel': g=drawPoly(C,coneFaces(0,0,10.5,20,COL.yellow),COL.yellow); break;
    case 'torus': g=drawPoly(C,torusFaces(8.5,3.6,4,COL.green),COL.green); break;
    case 'roehre': g=drawPoly(C,prismFaces(circle(0,0,10,40),0,16),COL.teal)+drawHole(C,0,0,6,16,0,COL.teal); break;
    case 'prisma': g=drawPoly(C,prismFaces(circle(0,0,10.5,6),0,16),COL.teal,{edges:true}); break;
    case 'pyramide': { const b=[[-10,-10],[10,-10],[10,10],[-10,10]], F=[];
      for(let i=0;i<4;i++){const a=b[i],c=b[(i+1)%4]; F.push({pts:[[a[0],a[1],0],[c[0],c[1],0],[0,0,18]]});}
      g=drawPoly(C,F,COL.yellow,{edges:true}); break; }
    case 'text': g=embossText(C,'Aa',0,0,0,5,17,COL.red); break;
    case 'stern': g=drawPoly(C,prismFaces(starPts(0,0,13,5.5),0,5),COL.yellow); break;
    case 'karte': g=drawPoly(C,prismFaces(rrect(34,24,2),0,1.4),COL.white)
      +drawPoly(C,prismFaces([[-6,-9],[6,-9],[2,-3],[5,-3],[1,3],[3,3],[-0,9],[-3,3],[-1,3],[-5,-3],[-2,-3]].map(p=>[p[0]-6,p[1]]),1.4,3),COL.green)
      +drawPoly(C,prismFaces(starPts(-6,10,2.6,1.1),1.4,3.4),COL.yellow); break;
    case 'vase': g=drawPoly(C,latheFaces([[0.01,0],[7,0],[9.5,6],[8,14],[5,19],[6.5,23]],COL.purple,1.1,48),COL.purple); break;
    case 'figur': g=drawPoly(C,[...sphereFaces(0,0,6.5,6.5,COL.white),...sphereFaces(0,0,16,4.6,COL.white),...sphereFaces(0,-4.2,16.5,1,COL.orange,10,6),
      ...sphereFaces(1.6,-3.8,18,.6,COL.dark,8,5),...sphereFaces(-1.6,-3.8,18,.6,COL.dark,8,5)],COL.white); break;
    case 'schmuck': g=drawPoly(C,[...prismFaces(starPts(0,0,13,5.5,6),0,4,undefined,COL.red),...torusFaces(2.4,.8,0,COL.red,14,6).map(f=>({...f,pts:f.pts.map(p=>[p[0],p[1]+15,p[2]+2])}))],COL.red); break;
    case 'schild': g=drawPoly(C,prismFaces(rrect(34,16,3),0,2),COL.blue)+embossText(C,'TOM',0,0,2,1.4,8.5,COL.white); break;
    case 'halterung': g=drawPoly(C,prismFaces([[0,0],[18,0],[18,3.5],[3.5,3.5],[3.5,18],[0,18]],0,14,(u,v,t)=>[u-9,-(t-7),v]),COL.orange,{edges:true}); break;
    case 'box': g=drawPoly(C,prismFaces(rrect(22,18,1.5),0,11),COL.teal)+drawPoly(C,prismFaces(rrect(23,19,1.8),11.6,14.6),[120,200,190]); break;
    case 'ersatzteil': g=drawPoly(C,prismFaces(gearPts(12,9.4,10),0,5),COL.grey)+drawHole(C,0,0,3.4,5,0,COL.grey); break;
    case 'anhaenger': g=drawPoly(C,prismFaces(rrect(30,12,3),0,2.4),COL.white)+drawHole(C,-11.5,0,1.8,2.4,0,COL.white)+embossText(C,'LENA',2,0,2.4,1,6,COL.red); break;
    case 'leer': { const sq=[[-14,-14],[14,-14],[14,14],[-14,14]].map(p=>C.p(p[0],p[1],0)); const c=C.p(0,0,0);
      g=`<polygon points="${ptsAttr2(sq)}" style="fill:var(--bed);stroke:var(--fg-3)" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M${r1(c[0]-7)} ${r1(c[1])}h14M${r1(c[0])} ${r1(c[1]-7)}v14" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round"/>`; break; }
  }

}

const CIRC='①②③④⑤⑥⑦⑧⑨';
function recipe(){
  const id=S.scene, q=(st,v)=>({t:T('Quader','Box')+' '+(v||'50 × 20 × 4 mm'),st,go:'tippen'});
  const r=st=>({t:T('4 senkrechte Kanten abgerundet · 4 mm','4 vertical edges rounded · 4 mm'),st,go:'abrunden'});
  const tx=st=>({t:T('Text „LENA“ geprägt · 1,5 mm','Text “LENA” embossed · 1.5 mm'),st,go:'text'});
  const lo=st=>({t:T('Loch Ø 5 mm durchgehend','Hole Ø 5 mm through'),sub:T('schneidet aus: Quader','subtracts from: Box'),st,go:'loch'});
  switch(id){
    case 'leer': return [];
    case 'quader': return [q('edit','34 × 20 × 20 mm')];
    case 'tippen': { const t=S.typed; const v=t?`${fmt(t.w)} × ${fmt(t.d)} × ${fmt(t.h)} mm`:undefined; return [q(t&&!t.done?'edit':'ok',v)]; }
    case 'abrunden': return [q('ok'),r('edit')];
    case 'text': return [q('ok'),r('ok'),tx('edit')];
    case 'loch': return [q('ok'),r('ok'),tx('ok'),lo('edit')];
    case 'fehler': return [q('ok'),r('ok'),tx('ok'),lo('ok'),{t:T('4 Kanten oben abgerundet · ','4 top edges rounded · ')+(S.errorFixed?T('3,9 mm','3.9 mm'):'5 mm'),sub:S.errorFixed?'':T('Die Rundung passt nicht hinein','The rounding does not fit'),st:S.errorFixed?'ok':'bad',go:'fehler'}];
    case 'rund': return [{t:T('Quader 80 × 40 × 10 mm · Ecken 5 mm','Box 80 × 40 × 10 mm · corners 5 mm'),sub:T('vorher 40 mm breit','was 40 mm wide'),st:'edit',go:'rund'},{t:T('Loch Ø 6 mm durchgehend','Hole Ø 6 mm through'),sub:T('10 mm vom linken Rand','10 mm from left edge'),st:'ok',go:'rund'}];
    default: return [q('ok'),r('ok'),tx('ok'),lo('ok')];
  }
}
function stBadge(st){
  return st==='ok'?`<span class="st ok" title="${T('in Ordnung','ok')}">${icon('ok')}<span class="sr">${T('in Ordnung','ok')}</span></span>`
   : st==='edit'?`<span class="st edit" title="${T('wird bearbeitet','editing')}">${icon('pencil')}<span class="sr">${T('wird bearbeitet','editing')}</span></span>`
   : `<span class="st bad" title="${T('geht nicht','fails')}">${icon('warn')}<span class="sr">${T('geht nicht','fails')}</span></span>`;
}
function bodies(){
  const id=S.scene; if(['leer','start','karte'].includes(id)) return [];
  const b=[{k:'box',n:T('Quader','Box'),c:COL.white}];
  if(['text','loch','export','fehler','suche'].includes(id)) b.push({k:'text',n:T('Text „LENA“','Text “LENA”'),c:COL.red});
  if(['loch','export','fehler','suche'].includes(id)) b.push({k:'hole',n:T('Loch Ø 5 mm','Hole Ø 5 mm'),hole:true});
  if(id==='rund') b.push({k:'hole',n:T('Loch Ø 6 mm','Hole Ø 6 mm'),hole:true});
  return b;
}

/* ======================= scene model ======================= */
function model(){
  const id=S.scene, K={w:50,d:20,h:4,r:4,text:true,hole:true,holeX:-20,holeDia:5};
  let m;
  switch(id){
    case 'leer': m={empty:true,cam:{zoom:1}}; break;
    case 'quader': m={w:34,d:20,h:20,r:0,cam:{zoom:2.7,tx:-42,ty:0,tz:4}}; break;
    case 'tippen': { const t=S.typed||{w:50,d:20,h:4}; m={w:t.w,d:t.d,h:t.h,r:0,cam:{zoom:4.2,tx:2,ty:0,tz:4}}; break; }
    case 'abrunden': m={...K,text:false,hole:false,cam:{zoom:5,tx:0,ty:0,tz:2}}; break;
    case 'text': m={...K,hole:false,cam:{zoom:5,tx:0,ty:0,tz:3}}; break;
    case 'loch': m={...K,hole:S.holeOn,ghost:S.holeOn,solid:!S.holeOn,cam:{zoom:4.4,tx:-5,ty:0,tz:4}}; break;
    case 'rund': m={w:80,d:40,h:10,r:5,x0:20,hole:true,holeX:-10,holeDia:6,cam:{zoom:2.4,tx:26,ty:0,tz:6}}; break;
    case 'karte': m={card:true,cam:{zoom:1.75,a:-22,e:54,tx:0,ty:-6,tz:0}}; break;
    default: m={...K,cam:{zoom:5,tx:0,ty:0,tz:3}};
  }
  for(const k of ['w','d','h','r']) if(S.edits[k]!=null && !m.empty && !m.card) m[k]=S.edits[k];
  if(m.r>=Math.min(m.w,m.d)/2) m.r=Math.min(m.w,m.d)/2-0.05;
  return m;
}

/* ======================= gizmos: "Achsen" (default) and "Klassisch" (Tinkercad-like) ======================= */
const scrDir=(C,p,v,len)=>{const a=C.p(...p), b=C.p(p[0]+v[0],p[1]+v[1],p[2]+v[2]); const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [a,[a[0]+dx/l*len,a[1]+dy/l*len]];};
function axisArrow(A,B,cls,label){
  const ang=Math.atan2(B[1]-A[1],B[0]-A[0]), l=13, w=0.42;
  const tip=B, b1=[B[0]-l*Math.cos(ang-w),B[1]-l*Math.sin(ang-w)], b2=[B[0]-l*Math.cos(ang+w),B[1]-l*Math.sin(ang+w)];
  const lx=B[0]+Math.cos(ang)*14, ly=B[1]+Math.sin(ang)*14;
  return `<line x1="${r1(A[0])}" y1="${r1(A[1])}" x2="${r1(B[0]-Math.cos(ang)*8)}" y2="${r1(B[1]-Math.sin(ang)*8)}" class="g${cls}" stroke-width="3.2" stroke-linecap="round"/>
    <polygon points="${ptsAttr2([tip,b1,b2])}" class="g${cls}f" style="cursor:pointer"/>
    <text x="${r1(lx)}" y="${r1(ly)}" class="glab g${cls}f" text-anchor="middle" dominant-baseline="central">${label}</text>`;
}
function selOutline(C,outline,z0,z1){
  const top=outline.map(p=>C.p(p[0],p[1],z1)), all=[...outline.map(p=>C.p(p[0],p[1],z0)),...top];
  return `<polygon points="${ptsAttr2(hull(all))}" class="selo" opacity=".55"/><polygon points="${ptsAttr2(top)}" class="selo"/>`;
}
/* dimension band parallel to an edge, label pill rotated with the edge (kept upright) */
function dimBand(C,p1,p2,e1,e2,html,cls=''){
  const A=C.p(...p1), B=C.p(...p2), E1=C.p(...e1), E2=C.p(...e2);
  let ang=Math.atan2(B[1]-A[1],B[0]-A[0])*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
  if(Math.abs(ang)>65) ang=0;
  const n=[-(B[1]-A[1]),(B[0]-A[0])], nl=Math.hypot(...n)||1, t=[n[0]/nl*5,n[1]/nl*5];
  O.h+=`<div class="ov dpill ${cls}" style="left:${r1(clamp((A[0]+B[0])/2,30,O.W-30))}px;top:${r1(clamp((A[1]+B[1])/2,20,O.H-20))}px;transform:translate(-50%,-50%) rotate(${r1(ang)}deg);transform-origin:50% 50%">${html}</div>`;
  return line(E1,A,'dimb')+line(E2,B,'dimb')+line(A,B,'dimb')+line([A[0]-t[0],A[1]-t[1]],[A[0]+t[0],A[1]+t[1]],'dimb')+line([B[0]-t[0],B[1]-t[1]],[B[0]+t[0],B[1]+t[1]],'dimb');
}
function boxDims(C,m,active,typed){
  const W=m.w,D=m.d,H=m.h, ox=m.x0||0, o=Math.max(4,Math.min(W,D)*0.28);
  const lab=(f,v)=>{ const on=active===f; return `<b>${on?(typed||''):fmt(v)}</b> mm`; };
  let s='';
  s+=dimBand(C,[ox-W/2,-D/2-o,H],[ox+W/2,-D/2-o,H],[ox-W/2,-D/2,H],[ox+W/2,-D/2,H],lab('w',W),active==='w'?'active':'');
  s+=dimBand(C,[ox+W/2+o,-D/2,H],[ox+W/2+o,D/2,H],[ox+W/2,-D/2,H],[ox+W/2,D/2,H],lab('d',D),active==='d'?'active':'');
  s+=dimBand(C,[ox+W/2+o*0.7,-D/2-o*0.7,0],[ox+W/2+o*0.7,-D/2-o*0.7,H],[ox+W/2,-D/2,0],[ox+W/2,-D/2,H],lab('h',H),active==='h'?'active':'');
  return s;
}
function moveGizmo(C,c,L=78){ // c = 3D anchor (top centre)
  const [A,X]=scrDir(C,c,[1,0,0],L), [,Y]=scrDir(C,c,[0,1,0],L*0.85), [,Z]=scrDir(C,c,[0,0,1],L*1.25);
  return axisArrow(A,Z,'z','Z')+axisArrow(A,Y,'y','Y')+axisArrow(A,X,'x','X')+`<circle cx="${r1(A[0])}" cy="${r1(A[1])}" r="8" style="fill:#fff;stroke:var(--handle-line)" stroke-width="1.5"/>`;
}
function sizeDots(C,m){ // push-pull dots on face centres (tool "Größe")
  const ox=m.x0||0, pts=[[ox+m.w/2,0,m.h/2],[ox,-m.d/2,m.h/2],[ox,0,m.h]];
  return pts.map(p=>{const q=C.p(...p); return `<circle cx="${r1(q[0])}" cy="${r1(q[1])}" r="7" style="fill:var(--accent-line);stroke:#fff" stroke-width="2" class="pick"><title>${T('Ziehen ändert das Maß','Drag to change the size')}</title></circle>`;}).join('');
}
function classicHandles(C,m){
  const W=m.w,D=m.d,H=m.h, ox=m.x0||0; let s='';
  [[W/2,-D/2],[W/2,D/2],[-W/2,D/2],[-W/2,-D/2]].forEach(([x,y])=>{s+=hdl(C.p(ox+x,y,0));});
  const tc=C.p(ox,0,H); s+=line(tc,[tc[0],tc[1]-26],'dim')+hdl([tc[0],tc[1]-26])+hdl(tc,'lift',8);
  return s;
}

/* ======================= 3D view ======================= */
let O;
function at(P,html,cls='',attrs=''){
  const x=clamp(P[0],8,O.W-8), y=clamp(P[1],8,O.H-8);
  O.h+=`<div class="ov ${cls}" style="left:${r1(x)}px;top:${r1(y)}px" ${attrs}>${html}</div>`;
}
function ctxBar(P,items,below){
  at([clamp(P[0],330,O.W-370),Math.max(P[1]+(below?22:-22),84)],items.map(([ic,l,on,k])=>`<button ${on!==undefined?`aria-pressed="${!!on}"`:''} data-act="mock" data-msg="${l}">${icon(ic)}${l}${k?` <span class="k">${k}</span>`:''}</button>`).join(''),below?'ctx float below':'ctx float',`role="toolbar" aria-label="${T('Kontextleiste','Context bar')}"`);
}
function sceneOverlays(C,m){
  const id=S.scene, P=(x,y,z)=>C.p(x,y,z), classic=S.handles==='klassisch'; let s='';
  const W=m.w,D=m.d,H=m.h, ox=m.x0||0;
  const topY=()=>Math.min(...rrect(W,D,m.r||0,ox,0).map(p=>P(p[0],p[1],H)[1]));
  if(id==='quader'){
    if(classic){
      s+=classicHandles(C,m)+dimLine(C,[-W/2,-D/2-6,0],[W/2,-D/2-6,0],[-W/2,-D/2,0],[W/2,-D/2,0]);
      const c=P(W/2,-D/2,0); s+=cursorAt([c[0]+2,c[1]+2]);
      at(c,`<span>${T('Breite','Width')}</span> <b>34</b> mm · <span>${T('Tiefe','Depth')}</span> <b>20</b> mm`,'bubble');
    } else {
      s+=selOutline(C,rrect(W,D,0),0,H)+boxDims(C,m);
      if(S.tool==='groesse'){ s+=sizeDots(C,m); const q=P(W/2,0,H/2); const e=[q[0]+46,q[1]+18]; s+=arrow([q[0]+9,q[1]+3],e)+cursorAt(e); at(e,`<span>${T('Breite','Width')}</span> <b>34</b> mm`,'bubble'); }

  if(id==='tippen'){

    if(classic){
      s+=dimLine(C,[-W/2,-D/2-7,0],[W/2,-D/2-7,0],[-W/2,-D/2,0],[W/2,-D/2,0])+dimLine(C,[W/2+7,-D/2,0],[W/2+7,D/2,0],[W/2,-D/2,0],[W/2,D/2,0])+dimLine(C,[W/2+3,-D/2-3,0],[W/2+3,-D/2-3,H]);
      [[W/2,-D/2],[W/2,D/2],[-W/2,D/2],[-W/2,-D/2]].forEach(([x,y])=>{s+=hdl(P(x,y,0),'',8);});
      const chip=(f,lab,val,p)=>at(p,`<span>${lab}</span><b>${t.f===f&&!t.done?(t.txt[f]||''):fmt(val)}</b><span>mm</span>`,'dimf'+(t.f===f&&!t.done?' active':''));
      const pw=P(0,-D/2-7,0), pd=P(W/2+7,0,0), ph=P(W/2+3,-D/2-3,H/2);
      chip('w',T('Breite','Width'),t.w,[pw[0],pw[1]+20]); chip('d',T('Tiefe','Depth'),t.d,[pd[0]+70,pd[1]-6]); chip('h',T('Höhe','Height'),t.h,[ph[0]+64,ph[1]+40]);
    } else {
      s+=selOutline(C,rrect(W,D,0),0,H)+boxDims(C,m,t.done?null:t.f,t.txt&&t.f?t.txt[t.f]:'');
    }
    if(t.done) ctxBar([P(0,D/2,H)[0],topY()-60],[['pull',T('Ziehen','Pull')],['round',T('Abrunden','Round')],['hole',T('Loch','Hole')],['hollow',T('Aushöhlen','Hollow')],['pencil',T('Skizze darauf','Sketch on it')]]);
  }
  if(id==='abrunden'){
    const cs=[[W/2-m.r,-D/2+m.r,-90],[W/2-m.r,D/2-m.r,0],[-W/2+m.r,D/2-m.r,90],[-W/2+m.r,-D/2+m.r,180]];
    cs.forEach(([cx,cy,a0],i)=>{ const mid=(a0+45)*D2R, n=[Math.cos(mid),Math.sin(mid),0]; if(dot(n,C.toCam)<0.05) return;
      const arc=[...Array(13)].map((_,k)=>{const a=(a0+90*k/12)*D2R; return [cx+m.r*Math.cos(a),cy+m.r*Math.sin(a)];});
      const band=[...arc.map(p=>[p[0],p[1],0]),...arc.slice().reverse().map(p=>[p[0],p[1],H])];
      s+=`<polygon points="${ptsAttr(C,band)}" class="accsoft" opacity="${i===0?1:.6}"/>`; });
    const g=P(W/2-m.r+m.r*Math.SQRT1_2,-D/2+m.r-m.r*Math.SQRT1_2,H);
    s+=`<circle cx="${r1(g[0])}" cy="${r1(g[1]-16)}" r="11" style="fill:${classic?'var(--handle)':'var(--accent-line)'};stroke:${classic?'var(--accent-line)':'#fff'}" stroke-width="2"/><path d="M${r1(g[0]-5)} ${r1(g[1]-10)}a7 7 0 0 1 7-9" style="stroke:${classic?'var(--accent-line)':'#fff'}" fill="none" stroke-width="2" stroke-linecap="round"/>`;
    s+=line([g[0],g[1]-5],[g[0],g[1]],'accl');
    const e=[g[0]-70,g[1]-78]; s+=arrow([g[0]-8,g[1]-26],e)+cursorAt(e);
    at(e,`<span>${T('Rundung','Rounding')}</span> <b class="typed">4</b> mm`,'bubble');
    ctxBar([P(-6,D/2,H)[0],topY()-60],[['round',T('Abrunden','Round'),true],['bevel',T('Abschrägen','Bevel'),false,'⌥'],['ok',T('Alle senkrechten Kanten','All vertical edges'),true]]);

  if(id==='text'){
    const box=[[-12,-5.5],[16,-5.5],[16,5.5],[-12,5.5]].map(p=>[p[0],p[1],H+1.5]);

    const a=P(2,0,H+1.5);

    else { const [A,Z]=scrDir(C,[2,0,H+1.5],[0,0,1],60); s+=axisArrow(A,Z,'z','Z')+`<circle cx="${r1(A[0])}" cy="${r1(A[1])}" r="7" style="fill:#fff;stroke:var(--handle-line)" stroke-width="1.5"/>`; }
    at([a[0]+18,a[1]-44],`<span>${T('Prägehöhe','Emboss height')}</span> <b>${T('1,5','1.5')}</b> mm`,'bubble');
    ctxBar([P(0,D/2,H)[0],topY()-74],[['text',T('Text ändern','Edit text')],['layers',T('Geprägt ⇄ Graviert','Embossed ⇄ Engraved')],['palette',T('Farbe','Colour')],['arc',T('Im Bogen','Arc')]]);

  if(id==='loch'){

    at([top[0],top[1]-30],`${icon('scissors')} ${T('schneidet aus:','subtracts from:')} <b style="font-family:var(--font)">${T('Quader','Box')}</b> ▾`,'chip acc',`role="button" tabindex="0" data-act="mock" data-msg="${T('Ziel ändern: auch mehrere Körper möglich.','Change target: several bodies possible.')}"`);
    s+=line([top[0],top[1]-18],top,'ptr');
    if(classic){
      s+=dimLine(C,[-W/2,-D/2-6,H],[m.holeX,-D/2-6,H],[-W/2,-D/2,H],[m.holeX,0,H]);
      const dm=P((m.holeX-W/2)/2,-D/2-6,H);
      if(S.editDim) at([dm[0],dm[1]+22],`<input id="dimedit" value="5" aria-label="${T('Abstand vom Rand','Distance from edge')}"> mm ${T('vom Rand','from edge')}`,'chip acc');
      else at([dm[0],dm[1]+22],`<b>5 mm</b> ${T('vom Rand','from edge')}`,'chip',`role="button" tabindex="0" data-act="editdim"`);
      s+=hdl(P(m.holeX+2.5,0,H+3),'',8);
    } else {
      s+=dimBand(C,[-W/2,-D/2-6,H],[m.holeX,-D/2-6,H],[-W/2,-D/2,H],[m.holeX,0,H],S.editDim?`<input id="dimedit" value="5" style="width:40px;background:none;border:0;color:inherit;font:inherit;text-align:right"> mm`:`<b>5</b> mm`);
      const dm=P((m.holeX-W/2)/2,-D/2-6,H);
      if(!S.editDim) at([dm[0]+40,dm[1]+28],T('vom Rand – klick zum Ändern','from edge – click to change'),'chip',`role="button" tabindex="0" data-act="editdim" style="font-size:12px"`);
      s+=moveGizmo(C,[m.holeX,0,H+3]);
    }
    const dd=P(m.holeX+2.5,0,H+3); at([dd[0]+46,dd[1]+4],`Ø <b>5</b> mm`,'chip',`role="button" tabindex="0" data-act="mock" data-msg="${T('Durchmesser ändern: Griff ziehen oder tippen.','Change diameter: drag the handle or type.')}"`);
  }

    const arcPts=x=>[...Array(13)].map((_,k)=>{const a=(90+90*k/12)*D2R; return [x,-5+5*Math.cos(a),-1+5*Math.sin(a)];});
    s+=`<polygon points="${ptsAttr(C,[...arcPts(-21),...arcPts(21).reverse()])}" class="ghost-red"/>`+line(P(-21,-D/2,H),P(21,-D/2,H),'badl');
    const a=P(0,-D/2,H), cx=clamp(a[0]+20,110,O.W-470), cy=clamp(a[1]+100,70,O.H-250);

      <h4>${icon('warn')} ${T('Abrunden mit 5 mm geht hier nicht.','Rounding with 5 mm does not work here.')}</h4>
      <p>${T('Die Kante grenzt an eine Seitenfläche, die nur 4 mm hoch ist. Die Rundung passt dort nicht hinein.','The edge borders a side face that is only 4 mm high. The rounding does not fit there.')}</p>
      <div class="acts"><button class="btn sm primary" data-act="fix" data-arg="max">${T('Größtmöglichen Wert verwenden (3,9 mm)','Use largest possible value (3.9 mm)')}</button>

    const rf=P(60,0,H/2), e=[rf[0]+40,rf[1]+40];

      <path d="M232 20l26 30M258 20l-26 30" style="stroke:var(--bad)" stroke-width="3" stroke-linecap="round"/></svg>
      ${T('Ecken und Loch würden oval. Fission3D streckt stattdessen. Verzerren gibt es nur ausdrücklich: Ändern ▸ Mehr ▸ Verzerren, mit Hinweis vorher.','Corners and hole would turn oval. Fission3D stretches instead. Distorting only on purpose: Modify ▸ More ▸ Distort, with a warning first.')}</div>`;
  }
  if(id==='karte'){
    const st=S.kitStep;
    if(st===1||st===2){ s+=dimBand(C,[-74,-62,0],[74,-62,0],[-74,-52.5,0],[74,-52.5,0],'<b>148</b> mm')+dimBand(C,[84,-52.5,0],[84,52.5,0],[74,-52.5,0],[74,52.5,0],'<b>105</b> mm'); }
    if(st===3){ s+=`<polygon points="${ptsAttr(C,[[-64,-38],[-12,-38],[-12,36],[-64,36]].map(p=>[p[0],p[1],3]))}" class="selo"/>`;
      const a=P(-38,36,3); at([a[0],a[1]-22],`${T('Motiv: Tanne','Motif: fir tree')} · ${T('erhaben 1,2 mm','raised 1.2 mm')}`,'chip acc'); }
    if(st===4){ s+=`<polygon points="${ptsAttr(C,[[-8,-14],[68,-14],[68,18],[-8,18]].map(p=>[p[0],p[1],2.6]))}" class="selo"/>`;
      const a=P(30,18,2.6); at([a[0],a[1]-22],`Text · ${T('erhaben 1 mm','raised 1 mm')}`,'chip acc'); }
    if(st===6){ O.h+=`<div class="banner float">${icon('check')} ${T('Druckbar · passt in C6 · Kompaktbrief','Printable · fits C6 · compact letter')}</div>`; }
  }
  return s;
}

let camAnim=0;
function animateCam(to){
  cancelAnimationFrame(camAnim);
  if(RM()){ S.cam={...to}; renderView(); return; }
  const from={...S.cam}; let da=to.a-from.a; while(da>180) da-=360; while(da<-180) da+=360;
  const t0=performance.now(), dur=230;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    S.cam={a:from.a+da*e,e:from.e+(to.e-from.e)*e}; renderView(); if(k<1) camAnim=requestAnimationFrame(step); };
  camAnim=requestAnimationFrame(step);
}

/* ======================= accent colour (user setting) ======================= */
// Derives all accent tokens from one chosen colour and keeps every text/background pair at WCAG AA (4.5:1).
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=c=>'#'+c.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('').toUpperCase();
function rgb2hsl([r,g,b]){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb([h,s,l]){ const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)); return [f(0)*255,f(8)*255,f(4)*255]; }
const lum=c=>{const v=c.map(x=>{x/=255; return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);}); return .2126*v[0]+.7152*v[1]+.0722*v[2];};
const contrast=(a,b)=>{const x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const mix=(a,b,t)=>a.map((v,i)=>v*(1-t)+b[i]*t);
function shiftUntil(hsl,bg,dir,min=4.6){ let [h,s,l]=hsl; for(let i=0;i<100 && contrast(hsl2rgb([h,s,l]),bg)<min;i++) l=clamp(l+dir*0.01,0,1); return hsl2rgb([h,s,l]); }
function accentTokens(hex,dark){
  const base=rgb2hsl(hex2rgb(hex)), cs=getComputedStyle(document.documentElement);
  const tok=n=>hex2rgb(cs.getPropertyValue(n).trim()||'#808080');
  const panel=tok('--panel'), white=[255,255,255];
  const soft=mix(panel,hex2rgb(hex),dark?.22:.14);
  // accent text must stay readable on every surface it appears on: check against the worst one
  const bgs=[panel,tok('--field'),tok('--chrome'),tok('--view'),soft].sort((x,y)=>lum(x)-lum(y)), worst=dark?bgs[bgs.length-1]:bgs[0];
  const btn=shiftUntil(base,white,-1);                      // button fill, white label on top
  const text=dark?shiftUntil([base[0],Math.min(base[1],.9),Math.max(base[2],.6)],worst,+1):shiftUntil(base,worst,-1);
  const line=dark?hsl2rgb([base[0],Math.min(base[1],.95),clamp(Math.max(base[2],.62),0,.72)]):btn;
  return {'--accent':rgb2hex(btn),'--accent-hover':rgb2hex(hsl2rgb([base[0],base[1],clamp(rgb2hsl(btn)[2]+(dark?.05:-.05),0,1)])),
    '--accent-fg':'#FFFFFF','--accent-text':rgb2hex(text),'--accent-line':rgb2hex(line),'--accent-soft':rgb2hex(soft)};
}
const ACCENTS=[['#2563D9','Blau','Blue'],['#7C4DDB','Violett','Violet'],['#0E9AA7','Türkis','Teal'],['#D6336C','Pink','Pink'],['#5A6B85','Schiefer','Slate']];
function accentClash(hex){ // hues that already carry a meaning: red = fails, yellow = needs help, green = fits
  const [h,s]=rgb2hsl(hex2rgb(hex)); if(s<.25) return null;
  if(h<15||h>=345) return T('Rot bedeutet „geht nicht“','red means “does not work”');
  if(h>=25&&h<65) return T('Gelb bedeutet „braucht Hilfe“','yellow means “needs help”');
  if(h>=90&&h<155) return T('Grün bedeutet „passt“','green means “fits”');
  return null;
}
function applyAccent(){
  const R=document.documentElement;
  ['--accent','--accent-hover','--accent-fg','--accent-text','--accent-line','--accent-soft'].forEach(k=>R.style.removeProperty(k));
  if(S.accent.toUpperCase()==='#2563D9') return; // default palette is hand-tuned in the stylesheet
  const t=accentTokens(S.accent,effTheme()==='dark'); for(const k in t) R.style.setProperty(k,t[k]);
}
const effTheme=()=>S.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.theme;

function positionFlyout(){ // align the flyout with its palette button
  const f=$('#fly'), b=document.querySelector(`.palette [data-arg="${S.flyout}"]`); if(!f||!b) return;
  const vr=$('#view').getBoundingClientRect(), br=b.getBoundingClientRect();

const normq=s=>s.toLowerCase().trim();
function searchTools(q){
  q=normq(q); const L=S.lang;
  if(!q) return TOOLS.slice(0,5).map(t=>({t,why:null}));
  const res=[];
  for(const t of TOOLS){
    const name=normq(t[L]); let score=0, why=null;
    if(name.startsWith(q)) score=3; else if(name.includes(q)) score=2.5;
    else { for(const s of [...t.syn[L],...t.syn[L==='de'?'en':'de']]){ const words=q.split(/\s+/);
      if(s.includes(q)||q.includes(s)){ score=2; why=s; break; }
      if(words.every(w=>s.split(/\s+/).some(x=>x.startsWith(w)))){ score=1.5; why=s; break; } } }
    if(score) res.push({t,why,score});
  }
  return res.sort((a,b)=>b.score-a.score);
}
function searchHtml(){
  if(!S.search || !WORK(S.scene)) return '';
  const R=searchTools(S.search.q); S.search.n=R.length; const sel=Math.min(S.search.sel,Math.max(0,R.length-1));
  const hi=(txt,q)=>{const i=normq(txt).indexOf(normq(q)); return q&&i>=0?txt.slice(0,i)+'<mark>'+txt.slice(i,i+q.length)+'</mark>'+txt.slice(i+q.length):txt;};
  return `<div class="cmd float" role="dialog" aria-label="${T('Befehlssuche','Command search')}">
    <div class="cmd-in">${icon('search')}<input id="cmdq" value="${S.search.q.replace(/"/g,'&quot;')}" placeholder="${T('Was möchtest du tun? z. B. „runde ecken“','What do you want to do? e.g. “round corners”')}" role="combobox" aria-expanded="true" aria-controls="cmdres" aria-autocomplete="list" autocomplete="off"><kbd>Esc</kbd></div>
    <ul class="cmd-res" id="cmdres" role="listbox">${R.length?R.map((r,i)=>`<li role="option" aria-selected="${i===sel}" data-act="cmdpick" data-arg="${i}">
      <span class="ci">${icon(r.t.ic)}</span><span><span class="cn">${hi(r.t[S.lang],S.search.q)}</span> <span class="cg">· ${T(...r.t.g)}</span>
      <span class="why">${r.why?`${T('gefunden über','found via')} „${hi(r.why,S.search.q)}“ · `:''}${T(...r.t.d)}</span></span>${r.t.k?`<kbd>${r.t.k}</kbd>`:'<span></span>'}</li>`).join('')
      :`<li aria-disabled="true"><span class="ci">${icon('info')}</span><span>${T('Nichts gefunden. Probier ein anderes Wort, z. B. „rund“ oder „loch“.','Nothing found. Try another word, e.g. “round” or “hole”.')}</span><span></span></li>`}</ul>
    <div class="cmd-try">${T('Probier:','Try:')} ${(S.lang==='de'?['runde ecken','hohl','schraube','namen','knete']:['round corners','hollow','screw','name','clay']).map(w=>`<button data-act="tryq" data-arg="${w}">${w}</button>`).join('')}</div></div>`;
}

function previewSvg(w,h){
  const keep=S.display; S.display='farbe';
  try{
    const C=cam({a:-30,e:38,s:Math.min(w,h)/46,cx:w/2,cy:h*0.58,tx:0,ty:0,tz:2});
    const m={w:50,d:20,h:4,r:4,text:true,hole:true,holeX:S.exp.fixed?-19.5:-20,holeDia:5};
    let s=SVGDEFS(3)+drawKeychain(C,m);

    if(!S.exp.fixed){ const ring=circle(m.holeX,0,4.6,40).map(p=>[p[0],p[1],m.h]); s+=`<polygon points="${ptsAttr(C,ring)}" fill="none" style="stroke:var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>`; }
    return `<svg viewBox="0 0 ${w} ${h}" aria-label="${T('Vorschau: Schlüsselanhänger','Preview: key tag')}" role="img">${s}</svg>`;
  } finally { S.display=keep; }
}
